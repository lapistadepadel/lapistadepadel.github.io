/* ---------- boot ---------- */
function formBusy(){ const ae=document.activeElement; return ['nuevo','torneo-nuevo','evento-nuevo'].includes(viewName()) || !!S.tEdit || (ae && ['INPUT','SELECT','TEXTAREA'].includes(ae.tagName)); }
window.appRefresh = () => renderData();
function renderData(){ if (S.status==='ready' && formBusy()){ S.pending=true; return; } S.pending=false; render(); }
document.addEventListener('focusout', () => setTimeout(() => { if (S.pending && !formBusy()) renderData(); }, 60));
function checkReady(){ if (S.ready.p && S.ready.m && S.status==='loading'){ S.status='ready'; render(); return; } renderData(); }
async function boot(){
  try{ const s=localStorage.getItem('sortBy'); if (s && ['elo','victorias','pct'].includes(s)) S.sortBy=s; }catch(_){}
  render();
  const c = window.claude;
  if (!c || !c.use){ S.status='nodb'; render(); return; }
  const [db,user] = await Promise.all([c.use('db'), c.use('user')]);
  S.db = db; S.user = user;
  if (!db){ S.status='nodb'; render(); return; }
  if (user){
    S.me = await user.me(); S.uid = S.me.id; S.isOwner = S.me.isOwner;
    const w = await user.can('data.write'); if (w===false) S.canWrite = false;
  } else S.canWrite = false;
  const timer = setTimeout(()=>{ if (S.status==='loading'){ S.slow=true; render(); } }, 10000);
  const onErr = e => { clearTimeout(timer); if (S.status!=='ready') S.status='error'; else S.flash={t:'err',m:'Se ha perdido la conexión con los datos. Vuelve a abrir la página.'}; render(); };
  db.collection('players').onSnapshot(snap => {
    S.allPlayers = new Map(snap.docs.map(d => [d.id, {id:d.id, ...d.data()}]));
    S.players = new Map([...S.allPlayers].filter(([,p]) => !p.deleted));
    if (!snap.metadata.fromCache){ S.ready.p = true; }
    if (S.ready.p && S.ready.m) clearTimeout(timer);
    checkReady();
  }, onErr);
  db.collection('matches').onSnapshot(snap => {
    S.matches = snap.docs.map(d => { const x=d.data(); return {id:d.id, ...x, a:[...(x.a||[])], b:[...(x.b||[])], sets:(x.sets||[]).map(s=>[...s])}; })
      .filter(m => m.a.length===2 && m.b.length===2);
    if (!snap.metadata.fromCache){ S.ready.m = true; }
    if (S.ready.p && S.ready.m) clearTimeout(timer);
    checkReady();
  }, onErr);
  db.collection('events').onSnapshot(snap => { S.events = new Map(snap.docs.map(d => [d.id, {id:d.id, ...d.data()}])); renderData(); }, ()=>{});
  db.collection('rsvp').onSnapshot(snap => { S.rsvp = new Map(snap.docs.map(d => { const x=d.data(); return [d.id, {events: JSON.parse(JSON.stringify(x.events||{}))}]; })); renderData(); }, ()=>{});
  db.collection('tresults').onSnapshot(snap => { S.tres = new Map(snap.docs.map(d => { const x=d.data(); return [d.id, x.sets ? {sets:x.sets.map(s=>[...s])} : null]; })); renderData(); }, ()=>{});
  db.collection('tournaments').onSnapshot(snap => { S.tournaments = new Map(snap.docs.map(d => { const x=d.data(); return [d.id, {id:d.id, ...x, groups:(x.groups||[]).map(g=>({teams:(g.teams||[]).map(t=>[...t])})), results:{...(x.results||{})}}]; })); renderData(); }, ()=>{});
  db.doc('config/admins').onSnapshot(d => { S.admins = d.exists && Array.isArray(d.data().uids) ? [...d.data().uids] : []; renderData(); }, ()=>{});
  db.doc('config/liga').onSnapshot(d => { S.config = d.exists ? {...d.data()} : {}; renderData(); }, ()=>{});
}
window.addEventListener('hashchange', () => { S.pending=false; if (S.modal) closeModal(); S.confirmDel=null; S.tEdit=null; S.tDel=null; S.evDel=null; window.scrollTo(0,0); render(); });
window.startApp = boot;
})();
</script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
/* ===== Web shell v2: Google login, super admin, group requests, Firestore adapter ===== */
(() => {
const gb = () => document.getElementById('gateBody');
const escH = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const GOOGLE = '<svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.3-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.3 0-9.7-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.3-.4-3.5z"/></svg>';
const fmtD = t => { if (!t) return '—'; const d = new Date(t); return d.toLocaleDateString('es-ES',{day:'numeric',month:'short'}) + ' ' + d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}); };

if (!window.firebase || !window.FIREBASE_CONFIG || String(window.FIREBASE_CONFIG.apiKey||'').startsWith('PEGA')){
  gb().innerHTML = `<div class="gcard"><h2>Falta configurar Firebase</h2><p>Abre <strong>firebase-config.js</strong> y pega los datos de tu proyecto de Firebase, como explica la guía LEEME.</p></div>`;
  return;
}
firebase.initializeApp(window.FIREBASE_CONFIG);
const auth = firebase.auth(), fs = firebase.firestore(), FV = firebase.firestore.FieldValue;
const SUPER = String(window.SUPER_ADMIN_EMAIL||'').toLowerCase().trim();
let user = null, isSuper = false, appCfg = {creators:[]}, group = null, groupData = null;
const myEmail = () => (user.email||'').toLowerCase();
const isCreator = () => isSuper || (appCfg.creators||[]).includes(user.uid);
const isMemberOf = g => isSuper || (g.members||[]).includes(user.uid) || (g.admins||[]).includes(user.uid);
const isAdminOf = g => isSuper || (g.admins||[]).includes(user.uid);

/* Firestore has no arrays inside arrays: wrap inner arrays as {__a:[...]} */
const enc = x => Array.isArray(x) ? x.map(e => Array.isArray(e) ? {__a: enc(e)} : enc(e)) : (x && typeof x==='object') ? Object.fromEntries(Object.entries(x).map(([k,v])=>[k,enc(v)])) : x;
const dec = x => Array.isArray(x) ? x.map(dec) : (x && typeof x==='object') ? (Object.keys(x).length===1 && '__a' in x ? dec(x.__a) : Object.fromEntries(Object.entries(x).map(([k,v])=>[k,dec(v)]))) : x;
const mapErr = e => ({code: e && e.code==='permission-denied' ? 'invalid_argument' : e && e.code==='resource-exhausted' ? 'quota_exceeded' : 'unavailable', message: String(e && e.message || e)});
const rethrow = e => { throw mapErr(e); };

function makeDb(gid){
  const base = `groups/${gid}/`, gref = fs.doc('groups/'+gid);
  const ws = s => ({id:s.id, exists:s.exists, data:()=> s.exists ? dec(s.data()) : undefined, metadata:{fromCache:false, hasPendingWrites:!!(s.metadata&&s.metadata.hasPendingWrites)}});
  const special = {
    'config/liga':   {snap:d=>({name:d.name}), set:v=>gref.update({name:String(v.name||'').slice(0,40)})},
    'config/admins': {snap:d=>({uids:(d.admins||[]).filter(u=>u!==d.createdBy)}), set:v=>gref.update({admins:[...new Set([groupData.createdBy, ...(v.uids||[])].filter(Boolean))]})}
  };
  const docRef = path => {
    if (special[path]) { const sp = special[path]; return {id:path.split('/')[1], path,
      onSnapshot:(n,e)=>gref.onSnapshot(s=>n({id:path.split('/')[1], exists:s.exists, data:()=>sp.snap(s.data()||{}), metadata:{fromCache:false}}), x=>e&&e(mapErr(x))),
      set:v=>sp.set(v).catch(rethrow), update:v=>sp.set(v).catch(rethrow), get:async()=>{const s=await gref.get(); return {exists:true, data:()=>sp.snap(s.data()||{})};}, delete:async()=>{} }; }
    const r = fs.doc(base+path);
    return {id:r.id, path,
      get: async()=> ws(await r.get().catch(rethrow)),
      set: d => r.set(enc(d)).catch(rethrow),
      update: d => r.set(enc(d), {merge:true}).catch(rethrow),
      delete: () => r.delete().catch(rethrow),
      onSnapshot: (n,e) => r.onSnapshot(s=>n(ws(s)), x=>e&&e(mapErr(x))) };
  };
  const collRef = path => { const c = fs.collection(base+path); return {path,
    doc: id => docRef(path+'/'+(id || c.doc().id)),
    add: async d => { const r = await c.add(enc(d)).catch(rethrow); return docRef(path+'/'+r.id); },
    onSnapshot: (n,e) => c.onSnapshot(q=>n({docs:q.docs.map(ws), size:q.size, empty:q.empty, metadata:{fromCache:false}}), x=>e&&e(mapErr(x))) }; };
  return {doc:docRef, collection:collRef};
}

const photos = {};
function makeUser(){
  const owner = isSuper || groupData.createdBy===user.uid;
  const me = {id:user.uid, name:user.displayName||'', avatarUrl:user.photoURL||'', color:'#1b7a47', email:user.email, isOwner: owner, canEdit:false};
  return { me: async()=>me, id: async()=>user.uid, isOwner: async()=>owner, canEdit: async()=>false, can: async()=>true,
    profiles: async ids => Object.fromEntries([].concat(ids).map(i=>[i,{id:i, name: photos[i]?'·':'', avatarUrl: photos[i]||'', isMe:i===user.uid}])) };
}
const refresh = () => { if (window.appRefresh) window.appRefresh(); };

window.groupApi = {
  get data(){ return groupData; }, get id(){ return group; }, get email(){ return user && user.email; },
  get isSuper(){ return isSuper; }, requests: [], members: [],
  get role(){ return isSuper ? 'Superadmin' : (groupData && groupData.createdBy===user.uid) ? 'Admin' : 'Coadmin'; },
  inviteLink(){ return location.origin + location.pathname + '?g=' + group; },
  async approve(r){
    await fs.doc('groups/'+group).update({members: FV.arrayUnion(r.uid)}).catch(rethrow);
    await fs.doc(`groups/${group}/members/${r.uid}`).set({email:r.email||'', name:r.name||'', photo:r.photo||null, at:Date.now(), by:user.uid}).catch(rethrow);
    await fs.doc(`groups/${group}/requests/${r.uid}`).delete().catch(rethrow);
  },
  async reject(r){ await fs.doc(`groups/${group}/requests/${r.uid}`).delete().catch(rethrow); },
  async removeMember(uid){
    const upd = {members: FV.arrayRemove(uid)};
    if ((groupData.admins||[]).includes(uid)) upd.admins = FV.arrayRemove(uid);
    await fs.doc('groups/'+group).update(upd).catch(rethrow);
    await fs.doc(`groups/${group}/members/${uid}`).delete().catch(rethrow);
  },
  canRemove(uid){ return uid!==groupData.createdBy && uid!==user.uid && (isSuper || groupData.createdBy===user.uid || !(groupData.admins||[]).includes(uid)); },
  switchGroup(){ try{localStorage.removeItem('ptg_group')}catch(_){} location.href = location.pathname; },
  openSuper(){ try{localStorage.removeItem('ptg_group')}catch(_){} location.href = location.pathname + '?panel=super'; },
  signOut(){ try{localStorage.removeItem('ptg_group')}catch(_){} auth.signOut().then(()=>location.href=location.pathname); }
};

function showLogin(msg){
  gb().innerHTML = `<div class="gcard"><span class="eyebrow" style="color:var(--ink-accent);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase">Clasificación entre amigos</span>
    <h2>Entra con tu Gmail</h2><p>Partidos, ranking, convocatorias y torneos de tu grupo de pádel.</p>
    <button class="gbtn light" id="gLogin">${GOOGLE} Continuar con Google</button>
    ${msg?`<p style="color:var(--loss)">${escH(msg)}</p>`:''}</div>`;
  document.getElementById('gLogin').onclick = async () => {
    const prov = new firebase.auth.GoogleAuthProvider(); prov.setCustomParameters({prompt:'select_account'});
    try { await auth.signInWithPopup(prov); }
    catch(e){ if (e.code==='auth/popup-blocked' || e.code==='auth/operation-not-supported-in-this-environment') auth.signInWithRedirect(prov); else if (e.code!=='auth/popup-closed-by-user') showLogin('No se ha podido entrar: '+(e.message||e.code)); }
  };
}

async function loadGroups(){
  const q = await fs.collection('groups').get();
  return q.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
}

async function showHome(note, preselect){
  let all = [];
  try { all = await loadGroups(); } catch(e){ note = 'No se han podido cargar los grupos: '+(e.message||e.code); }
  const mine = all.filter(isMemberOf), others = all.filter(g=>!isMemberOf(g));
  const pending = {};
  await Promise.all(others.map(async g => { try { const s = await fs.doc(`groups/${g.id}/requests/${user.uid}`).get(); if (s.exists) pending[g.id] = true; } catch(_){} }));
  const sel = preselect && others.some(g=>g.id===preselect) ? preselect : (others[0]||{}).id;
  gb().innerHTML = `
    ${note?`<div class="note">${escH(note)}</div>`:''}
    <div class="gcard">
      <h2>Tus grupos</h2>
      ${mine.length?`<div class="glist">${mine.map(g=>`<button class="gitem" data-g="${escH(g.id)}"><span>${escH(g.name||'Grupo')}<small>${isSuper?'Superadministrador':g.createdBy===user.uid?'Lo creaste tú':(g.admins||[]).includes(user.uid)?'Eres administrador':'Miembro'} · ${(g.members||[]).length} miembro${(g.members||[]).length===1?'':'s'}</small></span><span aria-hidden="true">›</span></button>`).join('')}</div>`
        :`<p>Todavía no estás en ningún grupo. Elige uno abajo y pide acceso.</p>`}
    </div>
    ${others.length?`<div class="gcard">
      <h2>Unirte a un grupo</h2>
      <p>Elige el grupo y pide acceso. Un administrador del grupo tiene que aceptarte.</p>
      <div class="gform"><select id="gPick" aria-label="Grupo">${others.map(g=>`<option value="${escH(g.id)}"${g.id===sel?' selected':''}>${escH(g.name||'Grupo')}</option>`).join('')}</select></div>
      <div id="gReqBox"></div>
    </div>`:''}
    ${isCreator()?`<div class="gcard">
      <h2>Crear un grupo</h2>
      <p>Serás su administrador${isSuper?'':' y podrás aceptar a quien pida entrar'}.</p>
      <form class="gform" id="gNew"><input type="text" id="gName" maxlength="40" placeholder="Nombre del grupo" required><button class="btn primary" type="submit">Crear grupo</button></form>
    </div>`:''}
    ${isSuper?`<button class="gbtn" id="gSuper" style="background:var(--primary);color:var(--primary-fg)">Panel de superadministrador</button>`:''}
    <div class="gmeta"><span>${escH(user.email)}</span><button class="btn link" id="gOut">Cerrar sesión</button></div>`;
  gb().querySelectorAll('[data-g]').forEach(b => b.onclick = () => openGroup(b.dataset.g));
  document.getElementById('gOut').onclick = () => window.groupApi.signOut();
  const sp = document.getElementById('gSuper'); if (sp) sp.onclick = () => showSuper();
  const pick = document.getElementById('gPick');
  const drawReq = () => {
    const gid = pick.value, box = document.getElementById('gReqBox');
    if (pending[gid]) {
      box.innerHTML = `<div class="pending"><span style="flex:1">Solicitud enviada. Cuando un administrador la acepte, podrás entrar al grupo desde esta pantalla.</span><button class="btn link danger" id="gCancel">Cancelar</button></div>`;
      document.getElementById('gCancel').onclick = async () => { try { await fs.doc(`groups/${gid}/requests/${user.uid}`).delete(); delete pending[gid]; drawReq(); } catch(e){ alertBox(e); } };
    } else {
      box.innerHTML = `<button class="btn primary" id="gAsk" style="width:100%;padding:12px">Pedir acceso</button>`;
      document.getElementById('gAsk').onclick = async () => {
        try { await fs.doc(`groups/${gid}/requests/${user.uid}`).set({uid:user.uid, email:myEmail(), name:user.displayName||'', photo:user.photoURL||null, at:Date.now()}); pending[gid]=true; drawReq(); }
        catch(e){ alertBox(e); } };
    }
  };
  const alertBox = e => { document.getElementById('gReqBox').insertAdjacentHTML('beforeend', `<p style="color:var(--loss)">No se ha podido enviar: ${escH(e.message||e.code)}</p>`); };
  if (pick) { pick.onchange = drawReq; drawReq(); }
  const nf = document.getElementById('gNew');
  if (nf) nf.onsubmit = async e => { e.preventDefault();
    const name = document.getElementById('gName').value.trim(); if (!name) return;
    try { const r = await fs.collection('groups').add({name, createdBy:user.uid, admins:[user.uid], members:[user.uid], createdAt:Date.now()});
      await fs.doc(`groups/${r.id}/members/${user.uid}`).set({email:myEmail(), name:user.displayName||'', photo:user.photoURL||null, at:Date.now(), by:user.uid});
      openGroup(r.id); }
    catch(err){ showHome('No se ha podido crear el grupo: '+(err.message||err.code)); } };
}

async function showSuper(msg){
  if (!isSuper) return showHome();
  history.replaceState(null,'', location.pathname+'?panel=super');
  let users = [], groups = [];
  try { users = (await fs.collection('users').get()).docs.map(d=>({uid:d.id, ...d.data()})); groups = await loadGroups(); }
  catch(e){ msg = 'No se han podido cargar los datos: '+(e.message||e.code); }
  users.sort((a,b)=>(b.lastSeen||0)-(a.lastSeen||0));
  const creators = appCfg.creators||[];
  gb().innerHTML = `
    <button class="btn link" id="sBack" style="align-self:flex-start">← Volver a grupos</button>
    ${msg?`<div class="note">${escH(msg)}</div>`:''}
    <div class="gcard">
      <h2>Usuarios (${users.length})</h2>
      <p>Todos los Gmail que han entrado alguna vez. Un <strong>coadministrador</strong> puede crear grupos y administrar los suyos.</p>
      <div class="ulist">${users.map(u => { const sup = (u.email||'').toLowerCase()===SUPER, co = creators.includes(u.uid);
        return `<div class="urow"><span class="e"><strong>${escH(u.name||u.email)}</strong><small>${escH(u.email)} · último acceso ${escH(fmtD(u.lastSeen))}</small></span>
          ${sup?'<span class="tag">Superadmin</span>':co?`<button class="btn link danger" data-unco="${escH(u.uid)}" data-nm="${escH(u.email)}">Quitar coadmin</button>`:`<button class="btn" data-co="${escH(u.uid)}" data-nm="${escH(u.email)}">Hacer coadmin</button>`}</div>`; }).join('') || '<p>Nadie ha entrado todavía.</p>'}</div>
    </div>
    <div class="gcard">
      <h2>Grupos (${groups.length})</h2>
      <div class="ulist">${groups.map(g => { const cr = users.find(u=>u.uid===g.createdBy);
        return `<div class="urow"><span class="e"><strong>${escH(g.name||'Grupo')}</strong><small>${(g.members||[]).length} miembros · creado por ${escH(cr?cr.email:'—')}</small></span><button class="btn" data-g="${escH(g.id)}">Entrar</button></div>`; }).join('') || '<p>No hay grupos.</p>'}</div>
    </div>`;
  document.getElementById('sBack').onclick = () => { history.replaceState(null,'',location.pathname); showHome(); };
  gb().querySelectorAll('[data-g]').forEach(b => b.onclick = () => openGroup(b.dataset.g));
  const setCreators = async list => { try { await fs.doc('config/app').set({creators:list, at:Date.now()}, {merge:true}); appCfg.creators = list; showSuper('Cambios guardados.'); } catch(e){ showSuper('No se ha podido guardar: '+(e.message||e.code)); } };
  gb().querySelectorAll('[data-co]').forEach(b => b.onclick = () => setCreators([...new Set([...creators, b.dataset.co])]));
  gb().querySelectorAll('[data-unco]').forEach(b => b.onclick = () => setCreators(creators.filter(x=>x!==b.dataset.unco)));
}

async function openGroup(gid){
  let snap;
  try { snap = await fs.doc('groups/'+gid).get(); } catch(e){ snap = null; }
  if (!snap || !snap.exists){ history.replaceState(null,'',location.pathname); try{localStorage.removeItem('ptg_group')}catch(_){} return showHome('Ese grupo ya no existe.'); }
  const g = snap.data();
  if (isSuper && !g.createdBy){ // grupo creado con la versión anterior: lo adapta
    const cb = g.owner || user.uid;
    try { await fs.doc('groups/'+gid).update({createdBy:cb, members:FV.arrayUnion(cb), admins:FV.arrayUnion(cb)}); Object.assign(g,{createdBy:cb, members:[...new Set([...(g.members||[]),cb])], admins:[...new Set([...(g.admins||[]),cb])]}); } catch(_){}
  }
  if (!isMemberOf(g)){ history.replaceState(null,'',location.pathname); try{localStorage.removeItem('ptg_group')}catch(_){} return showHome(`Todavía no formas parte de «${g.name||'este grupo'}». Pide acceso abajo.`, gid); }
  group = gid; groupData = g;
  try{ localStorage.setItem('ptg_group', gid); }catch(_){}
  if (new URLSearchParams(location.search).get('g')!==gid) history.replaceState(null,'', location.pathname+'?g='+gid+location.hash);
  fs.doc('groups/'+gid).onSnapshot(s => { if (s.exists) { groupData = s.data(); refresh(); } }, ()=>{});
  fs.collection('groups/'+gid+'/players').onSnapshot(q => q.docs.forEach(d => { const x=d.data(); if (x.uid && x.photo) photos[x.uid]=x.photo; }), ()=>{});
  if (isAdminOf(g)) {
    fs.collection('groups/'+gid+'/requests').onSnapshot(q => { window.groupApi.requests = q.docs.map(d=>({uid:d.id, ...d.data()})).sort((a,b)=>(a.at||0)-(b.at||0)); refresh(); }, ()=>{});
    fs.collection('groups/'+gid+'/members').onSnapshot(q => { window.groupApi.members = q.docs.map(d=>({uid:d.id, ...d.data()})).sort((a,b)=>(a.email||'').localeCompare(b.email||'')); refresh(); }, ()=>{});
  }
  const db = makeDb(gid), usr = makeUser();
  window.claude = { use: async n => n==='db' ? db : n==='user' ? usr : null };
  document.body.classList.remove('gated');
  window.startApp();
}

auth.getRedirectResult().catch(e => showLogin('No se ha podido entrar: '+(e.message||e.code)));
auth.onAuthStateChanged(async u => {
  if (!u) return showLogin();
  user = u; isSuper = !!SUPER && myEmail()===SUPER;
  gb().innerHTML = '<p class="muted">Cargando…</p>';
  try { await fs.doc('users/'+u.uid).set({email:myEmail(), name:u.displayName||'', photo:u.photoURL||null, lastSeen:Date.now()}, {merge:true}); } catch(_){}
  try { const c = await fs.doc('config/app').get(); if (c.exists) appCfg = {creators:[], ...c.data()}; } catch(_){}
  const qs = new URLSearchParams(location.search), want = qs.get('g');
  let last = null; try{ last = localStorage.getItem('ptg_group'); }catch(_){}
  if (qs.get('panel')==='super' && isSuper) showSuper();
  else if (want) openGroup(want); else if (last) openGroup(last); else showHome();
});
})();
</script>
