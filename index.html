/* balanced pairs: strength from the ranking (win rate smoothed + games won) */
function strength(pid){ const s = S.lastC && S.lastC.st.get(pid); if (!s || !s.pj) return 0.5; return 0.6*((s.pg+1)/(s.pj+2)) + 0.4*pGames(s); }
function driveScore(pid){ const s = S.lastC && S.lastC.st.get(pid); return s ? (s.sd.drive.pj - s.sd.reves.pj) : 0; }
function orderPair(x, y){ return driveScore(x) >= driveScore(y) ? [x,y] : [y,x]; }
function courtOptions(four){
  const [p,q,r,t] = four;
  return [[[p,q],[r,t]], [[p,r],[q,t]], [[p,t],[q,r]]].map(([A,B]) => ({A:orderPair(...A), B:orderPair(...B), diff:Math.abs(strength(A[0])+strength(A[1])-strength(B[0])-strength(B[1]))})).sort((a,b)=>a.diff-b.diff);
}
function makePairs(e, sm){
  const pids = sm.starters.map(r=>playerByUid(r.uid)?.id).filter(Boolean);
  const nC = Math.floor(pids.length/4); if (!nC) return [];
  const sorted = pids.slice(0, nC*4).sort((a,b)=>strength(b)-strength(a));
  const k = (S.pairIdx && S.pairIdx[e.id]) || 0;
  const courts = [];
  for (let c=0;c<nC;c++){ const opts = courtOptions(sorted.slice(c*4, c*4+4)); courts.push(opts[k % opts.length]); }
  return courts;
}
function pairsBox(e, sm){
  const open = S.pairOpen && S.pairOpen[e.id];
  if (!open) return `<button class="btn" data-pairs="${esc(e.id)}" style="align-self:flex-start">⚖️ Hacer parejas equilibradas</button>`;
  const courts = makePairs(e, sm);
  if (!courts.length) return '<p class="small muted">Hacen falta 4 jugadores con cuenta para hacer parejas.</p>';
  const nm = (pid, side) => `<span class="pname" style="gap:6px">${av(pid)}<span>${esc(nick(pid))} <span class="tag">${side}</span></span></span>`;
  return `<div class="pairsbox">

  </div>`;
}

async function saveRsvpRaw(eid, val){
  const ref = S.db.doc('rsvp/'+S.uid);
  if (S.rsvp.has(S.uid)) await ref.update({events:{[eid]:val}});
  else await ref.set({events:{[eid]:val}});
}
async function saveRsvp(eid, patch){
  const cur = (S.rsvp.get(S.uid)?.events || {})[eid] || {};
  const next = {...cur, ...patch, at:Date.now()};
  if (patch.play==='si' && cur.play!=='si') next.atSi = Date.now();
  if (patch.play && patch.play!=='si') next.atSi = null;
  if (patch.play==='no' && next.beer===undefined) {}
  const ref = S.db.doc('rsvp/'+S.uid);
  if (S.rsvp.has(S.uid)) await ref.update({events:{[eid]:next}});
  else await ref.set({events:{[eid]:next}});
}

  app.querySelectorAll('[data-beer]').forEach(b => b.onclick = () => { const eid = b.dataset.beer, prev = prevR(eid), v = b.dataset.v==='1'; if (prev && prev.beer===v) return; write(()=>saveRsvp(eid, {beer:v}), v ? 'Te has apuntado a las cervezas' : 'Has dicho que no vas a las cervezas', undoR(eid, prev)); });

  app.querySelectorAll('[data-srdel]').forEach(b => b.onclick = () => { const sr=S.events.get(b.dataset.srdel); if(!sr) return; askConfirm({title:'¿Terminar la serie?', text:'Dejarán de crearse convocatorias semanales y desaparecerán las próximas. Los resultados ya apuntados se mantienen.', actions:[{label:'Sí, terminar serie', danger:true, run:()=>write(()=>S.db.doc('events/'+sr.id).delete(), 'Serie terminada.')}]}); });

  app.querySelectorAll('[data-mdisp]').forEach(b => b.onclick = () => askConfirm({title:'¿El resultado no es correcto?', text:'Quedará marcado como discutido y un administrador lo revisará para corregirlo o borrarlo. Mientras tanto no cuenta.', actions:[{label:'Sí, marcar como discutido', danger:true, run:()=>write(()=>S.db.doc('matches/'+b.dataset.mdisp).update({disputed:true, disputedBy:S.uid, disputedAt:Date.now()}), 'Marcado como discutido. Avisa al administrador si hace falta.')}]}));

  app.querySelectorAll('[data-ics]').forEach(b => b.onclick = () => { const e=getEv(b.dataset.ics); if (e) saveFile(`padel-${e.date}.ics`, 'text/calendar;charset=utf-8', icsText(e)); });
  app.querySelectorAll('[data-evresult]').forEach(b => b.onclick = () => {

    const doc = {date:f.date, time:f.time||'', title:(f.title||'Partido').trim()||'Partido', place:f.place.trim(), slots:f.slots, beers:f.beers, note:f.note.trim(), createdAt:Date.now(), createdBy:S.uid};

  };
}

/* ---------- confirmation pop-up ---------- */
function askConfirm(m){ S.modal = m; renderModal(); }
function closeModal(){ S.modal = null; renderModal(); }
function renderModal(){
  const box = $('#modal');
  if (!S.modal){ box.hidden = true; box.innerHTML = ''; document.body.style.overflow=''; return; }
  const m = S.modal;
  box.hidden = false; document.body.style.overflow='hidden';
  box.innerHTML = `<div class="mback" data-mclose></div>
    <div class="mbox" role="alertdialog" aria-modal="true" aria-labelledby="mTitle" aria-describedby="mText">
      <div class="mico" aria-hidden="true">${m.actions.length?'!':'i'}</div>
      <h2 id="mTitle">${esc(m.title)}</h2>
      <p id="mText" class="muted" style="margin:0">${esc(m.text)}</p>
      ${m.detail?`<div class="mdetail">${m.detail}</div>`:''}
      <div class="mact">${m.actions.map((a,i)=>`<button class="btn ${a.danger?'dangerfill':''}" data-mact="${i}">${esc(a.label)}</button>`).join('')}<button class="btn ${m.actions.length?'':'primary'}" data-mclose>${m.actions.length?'Cancelar':'Entendido'}</button></div>
    </div>`;
  box.querySelectorAll('[data-mclose]').forEach(b => b.onclick = closeModal);
  box.querySelectorAll('[data-mact]').forEach(b => b.onclick = () => { const a = m.actions[+b.dataset.mact]; closeModal(); a.run(); });
  const c = box.querySelector('.mact [data-mclose]'); if (c) c.focus();
}
document.addEventListener('keydown', e => { if (e.key==='Escape' && S.modal) closeModal(); });

function shrinkImage(file, max){
  return new Promise((ok, ko) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => { const k = Math.min(1, max/Math.max(img.width, img.height)), w = Math.round(img.width*k), h = Math.round(img.height*k);
      const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); g.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url); const png = /png|svg|gif/.test(file.type);
      let out = png ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', 0.85);
      if (out.length > 300000) out = c.toDataURL('image/jpeg', 0.8);
      if (out.length > 300000) out = c.toDataURL('image/jpeg', 0.6);
      ok(out); };
    img.onerror = () => { URL.revokeObjectURL(url); ko(new Error('img')); };
    img.src = url;
  });
}

async function write(fn, okMsg, undo){
  if (S.busy) return; S.busy = true; let ok = false;
  try { await fn(); S.flash = null; ok = true; }
  catch(e){
    if (e && e.code==='invalid_argument') { S.canWrite=false; S.flash={t:'err',m:'No tienes permiso para guardar cambios. Pide a un administrador que revise tu acceso.'}; }
    else if (e && e.code==='quota_exceeded') S.flash={t:'err',m:'Se ha llenado el espacio de datos. Borra partidos antiguos para seguir.'};
    else S.flash={t:'err',m:'No se ha podido guardar. Inténtalo de nuevo en un momento.'};
  }
  S.busy = false; render();
  if (ok && (okMsg || undo)) showToast(okMsg || 'Hecho', undo);
}

function bindNew(form){
  const ids = ['a1','a2','b1','b2'];
  const labels = () => {
    const n = id => { const v=$('#'+id).value; return v? nick(v):'?'; };
    $('#salbl').textContent = `${n('a1')} / ${n('a2')}`; $('#sblbl').textContent = `${n('b1')} / ${n('b2')}`; updateSteps(form.querySelector('.steps'));
  };
  ids.forEach(i => $('#'+i).addEventListener('change', labels)); labels();
  form.onsubmit = e => {
    e.preventDefault();
    const err = msg => { const el=$('#formErr'); el.textContent=msg; el.hidden=false; };
    const v = ids.map(i=>$('#'+i).value);
    if (v.some(x=>!x)) return err('Elige los cuatro jugadores.');
    if (new Set(v).size<4) return err('Un mismo jugador no puede aparecer dos veces.');
    const ps = parseSetInputs('sa','sb', true); if (ps.err) return err(ps.err);
    if (ps.unfinished.length && !form.dataset.okUnfinished){
      askConfirm({title: ps.draw ? 'Partido empatado' : 'Partido no acabado', text:unfinishedText(ps), actions:[{label: ps.draw ? 'Guardar como empate' : 'Guardar resultado', run:()=>{ form.dataset.okUnfinished='1'; form.requestSubmit ? form.requestSubmit() : form.onsubmit(new Event('submit')); }}]});
      return;
    }
    delete form.dataset.okUnfinished;
    const sets = ps.sets;
    const date = $('#mDate').value || today();
    const place = $('#mPlace').value.trim();
    const editId = form.dataset.edit, old = editId ? S.matches.find(m=>m.id===editId) : null;
    const doc = {date, a:[v[0],v[1]], b:[v[2],v[3]], sets, by: old ? (old.by||S.uid) : S.uid, at: old ? (old.at||Date.now()) : Date.now()};
    if (place) doc.place = place;
    if (ps.unfinished.length && !ps.draw) doc.unfinished = true;
    if (ps.draw) doc.draw = true;
    if (form.dataset.event) { doc.eventId = form.dataset.event; doc.court = +form.dataset.court || 0; }
    else if (old && old.eventId) { doc.eventId = old.eventId; doc.court = old.court||0; }
    if ($('#mSides').checked) doc.sides = {[v[0]]:'drive', [v[1]]:'reves', [v[2]]:'drive', [v[3]]:'reves'};
    if (old){ doc.editedBy = S.uid; doc.editedAt = Date.now(); }
    doc.confirmed = isAdmin();
    if (doc.confirmed){ doc.confirmedBy = S.uid; doc.confirmedAt = Date.now(); }
    const meId = myPlayer()?.id, rr = result({sets}), iWon = !!meId && !rr.draw && ((rr.aWins && doc.a.includes(meId)) || (!rr.aWins && doc.b.includes(meId)));
    $('#saveBtn').disabled = true;
    if (old) write(async ()=>{ await S.db.doc('matches/'+editId).set(doc); location.hash='partidos'; }, 'Partido corregido. La clasificación ya está actualizada.');
    else write(async ()=>{ await S.db.collection('matches').add(doc); location.hash='partidos'; if (iWon) setTimeout(confetti, 250); }, doc.confirmed ? 'Partido guardado. La clasificación ya está actualizada.' : 'Partido guardado. Contará cuando lo confirme la pareja rival, o solo dentro de 4 horas si nadie dice nada.');
  };
}

function ago(ts){
  if (!ts) return '';
  const m = Math.round((Date.now()-ts)/60000);
  if (m < 2) return 'ahora';
  if (m < 60) return `hace ${m} min`;
  const h = Math.round(m/60); if (h < 24) return `hace ${h} h`;
  const d = Math.round(h/24); if (d === 1) return 'ayer';
  if (d < 7) return `hace ${d} días`;
  const dt = new Date(ts); return `${dt.getDate()} ${MESES[dt.getMonth()]}`;
}

/* week-on-week movement in the ranking */
function rankMoves(period, curActive){
  const key = (period||'todo')+'|'+S.matches.length+'|'+S.matches.filter(isCounted).length+'|'+S.tres.size+'|'+S.players.size+'|'+today();
  if (S.mvKey === key) return S.mv;
  const cut = isoD(new Date(Date.now()-7*864e5));
  const prev = rankList(compute(period, cut).st).active;
  const pp = new Map(prev.map(x=>[x.p.id, x.pos]));
  const mv = new Map();
  for (const x of curActive){ const o = pp.get(x.p.id); mv.set(x.p.id, o==null ? 'new' : o - x.pos); }
  S.mvKey = key; S.mv = mv; return mv;
}
function mvHtml(d){
  if (d==='new') return '<span class="mv nw" title="Nuevo en el ranking esta semana">nuevo</span>';
  if (!d) return '<span class="mv eq" title="Mismo puesto que hace una semana">=</span>';
  return d>0 ? `<span class="mv up" title="Ha subido ${d} puesto${d===1?'':'s'} esta semana">▲${d}</span>` : `<span class="mv dn" title="Ha bajado ${-d} puesto${d===-1?'':'s'} esta semana">▼${-d}</span>`;
}

/* position over time, for the player card */
function posHistory(id, C){
  const dates = [...new Set(C.ms.filter(m=>m.a.includes(id)||m.b.includes(id)).map(m=>m.date))].sort().slice(-12);
  return dates.map(d => { const {active} = rankList(compute(null, d+'~').st); const me = active.find(x=>x.p.id===id); return me ? {d, pos:me.pos, n:active.length} : null; }).filter(Boolean);
}
function posChart(id, C){
  const h = posHistory(id, C);
  if (h.length < 2) return '';
  const W=320, H=110, px=18, py=16, maxN = Math.max(...h.map(x=>x.n), 2);
  const X = i => px + i*(W-2*px)/(h.length-1), Y = p => py + (p-1)*(H-2*py)/(maxN-1);
  const pts = h.map((x,i)=>`${X(i).toFixed(1)},${Y(x.pos).toFixed(1)}`).join(' ');
  const best = Math.min(...h.map(x=>x.pos)), last = h[h.length-1];
  return `<div class="panel"><div class="row spread"><h3 style="margin:0">Su posición en el ranking</h3><span class="small muted">Mejor puesto: <strong style="color:var(--fg)">${best}º</strong></span></div>
    <svg class="poschart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución del puesto: ahora ${last.pos}º, mejor ${best}º">
      <line x1="${px}" x2="${W-px}" y1="${Y(1)}" y2="${Y(1)}" class="g1"/><text x="${px}" y="${Y(1)-6}" class="gt">1º puesto</text>
      <polyline points="${pts}" class="ln"/>
      ${h.map((x,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(x.pos).toFixed(1)}" r="${i===h.length-1?5:3}" class="${i===h.length-1?'pt last':'pt'}"><title>${fmtDay(x.d)}: ${x.pos}º</title></circle>`).join('')}
      <text x="${X(h.length-1)}" y="${Math.min(H-2, Y(last.pos)+18)}" text-anchor="end" class="lt">${last.pos}º</text>
    </svg>
    <p class="small muted" style="margin:4px 0 0">Puesto después de cada día que ha jugado (últimos ${h.length}).</p></div>`;
}

    if (![...m.a, ...m.b].includes(me)) continue;
    const A = m.a.includes(me) ? m.a : m.b, B = A===m.a ? m.b : m.a, mate = A.find(x=>x!==me);
    const k = [me, mate, ...[...B].sort()].join('|'); cnt.set(k, (cnt.get(k)||0)+1);
  }
  return [...cnt].sort((a,b)=>b[1]-a[1]).map(([k])=>k.split('|')).filter(ids => ids.every(id => S.players.has(id))).slice(0,2);
}

/* ---------- confetti and count-up ---------- */
function confetti(){
  try { if (matchMedia('(prefers-reduced-motion: reduce)').matches) return; } catch(_){}
  const box = document.createElement('div'); box.className = 'confetti'; box.setAttribute('aria-hidden','true');
  const cols = ['#16794a','#dfe63a','#1f5ba3','#e8bb2a','#7fd3a4','#ffffff'];
  for (let i=0;i<80;i++){ const s = document.createElement('i');
    s.style.left = (Math.random()*100)+'%'; s.style.background = cols[i%cols.length];
    s.style.animationDelay = (Math.random()*.35)+'s'; s.style.animationDuration = (1.7+Math.random()*1.3)+'s';
    s.style.setProperty('--dx', (Math.random()*180-90)+'px'); s.style.setProperty('--r', (Math.random()*900-450)+'deg');
    if (i%3===0) s.style.borderRadius = '50%';
    box.appendChild(s); }
  document.body.appendChild(box); setTimeout(() => box.remove(), 3500);
}
function countUp(root){
  try { if (matchMedia('(prefers-reduced-motion: reduce)').matches) return; } catch(_){}
  root.querySelectorAll('[data-count]').forEach(el => {
    const to = +el.dataset.count; if (!(to > 1)) return;
    const t0 = performance.now(), dur = 650;
    const step = t => { const k = Math.min(1, (t-t0)/dur), e = 1-Math.pow(1-k,3); el.textContent = Math.round(to*e); if (k<1) requestAnimationFrame(step); };
    el.textContent = '0'; requestAnimationFrame(step);
  });
}

if (!window.firebase || !window.FIREBASE_CONFIG || String(window.FIREBASE_CONFIG.apiKey||'').startsWith('PEGA')){
  gb().innerHTML = `<div class="gcard"><h2>Falta configurar Firebase</h2><p>Abre <strong>firebase-config.js</strong> y pega los datos de tu proyecto de Firebase, como explica la guía LEEME.</p></div>`;

/* Firestore has no arrays inside arrays: wrap inner arrays as {__a:[...]} */
const enc = x => Array.isArray(x) ? x.map(e => Array.isArray(e) ? {__a: enc(e)} : enc(e)) : (x && typeof x==='object') ? Object.fromEntries(Object.entries(x).map(([k,v])=>[k,enc(v)])) : x;
const dec = x => Array.isArray(x) ? x.map(dec) : (x && typeof x==='object') ? (Object.keys(x).length===1 && '__a' in x ? dec(x.__a) : Object.fromEntries(Object.entries(x).map(([k,v])=>[k,dec(v)]))) : x;
const mapErr = e => ({code: e && e.code==='permission-denied' ? 'invalid_argument' : e && e.code==='resource-exhausted' ? 'quota_exceeded' : 'unavailable', message: String(e && e.message || e)});
const rethrow = e => { throw mapErr(e); };

function makeDb(gid){
  const base = `groups/${gid}/`, gref = fs.doc('groups/'+gid);
  const ws = s => ({id:s.id, exists:s.exists, data:()=> s.exists ? dec(s.data()) : undefined, metadata:{fromCache:false, hasPendingWrites:!!(s.metadata&&s.metadata.hasPendingWrites)}});
  const special = {
    'config/liga':   {snap:d=>({name:d.name, logo:d.logo||null}), set:v=>{ const u={}; if (v.name!==undefined) u.name=String(v.name||'').slice(0,40); if (v.logo!==undefined) u.logo=v.logo||null; return gref.update(u); }},
    'config/admins': {snap:d=>({uids:(d.admins||[]).filter(u=>u!==d.createdBy)}), set:v=>gref.update({admins:[...new Set([groupData.createdBy, ...(v.uids||[])].filter(Boolean))]})}
  };
  const docRef = path => {
    if (special[path]) { const sp = special[path]; return {id:path.split('/')[1], path,
      onSnapshot:(n,e)=>gref.onSnapshot(s=>n({id:path.split('/')[1], exists:s.exists, data:()=>sp.snap(s.data()||{}), metadata:{fromCache:false}}), x=>e&&e(mapErr(x))),
      set:v=>sp.set(v).catch(rethrow), update:v=>sp.set(v).catch(rethrow), get:async()=>{const s=await gref.get(); return {exists:true, data:()=>sp.snap(s.data()||{})};}, delete:async()=>{} }; }
    const r = fs.doc(base+path);
    return {id:r.id, path,
      get: async()=> ws(await r.get().catch(rethrow)),
      set: d => r.set(enc(d)).catch(rethrow),
      update: d => r.set(enc(d), {merge:true}).catch(rethrow),
      delete: () => r.delete().catch(rethrow),
      onSnapshot: (n,e) => r.onSnapshot(s=>n(ws(s)), x=>e&&e(mapErr(x))) };
  };
  const collRef = path => { const c = fs.collection(base+path); return {path,
    doc: id => docRef(path+'/'+(id || c.doc().id)),
    add: async d => { const r = await c.add(enc(d)).catch(rethrow); return docRef(path+'/'+r.id); },
    onSnapshot: (n,e) => c.onSnapshot(q=>n({docs:q.docs.map(ws), size:q.size, empty:q.empty, metadata:{fromCache:false}}), x=>e&&e(mapErr(x))) }; };
  return {doc:docRef, collection:collRef};
}

async function deleteGroupAll(gid, onProgress){
  const subs = ['matches','players','tresults','events','tournaments','rsvp','requests','members'];
  for (const sub of subs){
    const q = await fs.collection(`groups/${gid}/${sub}`).get().catch(rethrow);
    let n = 0;
    for (const d of q.docs){ await fs.doc(`groups/${gid}/${sub}/${d.id}`).delete().catch(rethrow); n++; }
    if (onProgress) onProgress(sub, n);
  }
  await fs.doc('groups/'+gid).delete().catch(rethrow);
  try { if (localStorage.getItem('ptg_group')===gid) localStorage.removeItem('ptg_group'); } catch(_){}
}

    <div class="gcard">
      <h2>Tus grupos</h2>
      ${mine.length?`<div class="glist">${mine.map(g=>`<button class="gitem" data-g="${escH(g.id)}"><span style="display:flex;align-items:center;gap:12px">${g.logo?`<img src="${escH(g.logo)}" alt="" style="width:36px;height:36px;border-radius:10px;object-fit:cover;flex:none">`:''}<span>${escH(g.name||'Grupo')}<small>${isSuper?'Superadministrador':g.createdBy===user.uid?'Lo creaste tú':(g.admins||[]).includes(user.uid)?'Eres administrador':'Miembro'} · ${(g.members||[]).length} miembro${(g.members||[]).length===1?'':'s'}</small></span></span><span aria-hidden="true">›</span></button>`).join('')}</div>`
        :`<p>Todavía no estás en ningún grupo. Elige uno abajo y pide acceso.</p>`}
    </div>
    ${others.length?`<div class="gcard">
      <h2>Unirte a un grupo</h2>
      <p>Elige el grupo y pide acceso. Un administrador del grupo tiene que aceptarte.</p>
      <div class="gform"><select id="gPick" aria-label="Grupo">${others.map(g=>`<option value="${escH(g.id)}"${g.id===sel?' selected':''}>${escH(g.name||'Grupo')}</option>`).join('')}</select></div>
      <div id="gReqBox"></div>
    </div>`:''}
    ${isCreator()?`<div class="gcard">
      <h2>Crear un grupo</h2>
      <p>Serás su administrador${isSuper?'':' y podrás aceptar a quien pida entrar'}.</p>
      <form class="gform" id="gNew"><input type="text" id="gName" maxlength="40" placeholder="Nombre del grupo" required><button class="btn primary" type="submit">Crear grupo</button></form>
    </div>`:''}
    ${isSuper?`<button class="gbtn" id="gSuper" style="background:var(--primary);color:var(--primary-fg)">Panel de superadministrador</button>`:''}
    <div class="gmeta"><span>${escH(user.email)}</span><button class="btn link" id="gOut">Cerrar sesión</button></div>`;
  gb().querySelectorAll('[data-g]').forEach(b => b.onclick = () => openGroup(b.dataset.g));
  document.getElementById('gOut').onclick = () => window.groupApi.signOut();
  const sp = document.getElementById('gSuper'); if (sp) sp.onclick = () => showSuper();
  const pick = document.getElementById('gPick');
  const drawReq = () => {
    const gid = pick.value, box = document.getElementById('gReqBox');
    if (pending[gid]) {
      box.innerHTML = `<div class="pending"><span style="flex:1">Solicitud enviada. Cuando un administrador la acepte, podrás entrar al grupo desde esta pantalla.</span><button class="btn link danger" id="gCancel">Cancelar</button></div>`;
      document.getElementById('gCancel').onclick = async () => { try { await fs.doc(`groups/${gid}/requests/${user.uid}`).delete(); delete pending[gid]; drawReq(); } catch(e){ alertBox(e); } };
    } else {
      box.innerHTML = `<button class="btn primary" id="gAsk" style="width:100%;padding:12px">Pedir acceso</button>`;
      document.getElementById('gAsk').onclick = async () => {
        try { await fs.doc(`groups/${gid}/requests/${user.uid}`).set({uid:user.uid, email:myEmail(), name:user.displayName||'', photo:user.photoURL||null, at:Date.now()}); pending[gid]=true; drawReq(); }
        catch(e){ alertBox(e); } };
    }
  };
  const alertBox = e => { document.getElementById('gReqBox').insertAdjacentHTML('beforeend', `<p style="color:var(--loss)">No se ha podido enviar: ${escH(e.message||e.code)}</p>`); };
  if (pick) { pick.onchange = drawReq; drawReq(); }
  const nf = document.getElementById('gNew');
  if (nf) nf.onsubmit = async e => { e.preventDefault();
    const name = document.getElementById('gName').value.trim(); if (!name) return;
    try { const r = await fs.collection('groups').add({name, createdBy:user.uid, admins:[user.uid], members:[user.uid], createdAt:Date.now()});
      await fs.doc(`groups/${r.id}/members/${user.uid}`).set({email:myEmail(), name:user.displayName||'', photo:user.photoURL||null, at:Date.now(), by:user.uid});
      openGroup(r.id); }
    catch(err){ showHome('No se ha podido crear el grupo: '+(err.message||err.code)); } };
}

async function showSuper(msg){
  if (!isSuper) return showHome();
  history.replaceState(null,'', location.pathname+'?panel=super');
  let users = [], groups = [];
  try { users = (await fs.collection('users').get()).docs.map(d=>({uid:d.id, ...d.data()})); groups = await loadGroups(); }
  catch(e){ msg = 'No se han podido cargar los datos: '+(e.message||e.code); }
  users.sort((a,b)=>(b.lastSeen||0)-(a.lastSeen||0));
  const creators = appCfg.creators||[];
  gb().innerHTML = `
    <button class="btn link" id="sBack" style="align-self:flex-start">← Volver a grupos</button>
    ${msg?`<div class="note">${escH(msg)}</div>`:''}
    <div class="gcard">
      <h2>Usuarios (${users.length})</h2>
      <p>Todos los Gmail que han entrado alguna vez. Un <strong>coadministrador</strong> puede crear grupos y administrar los suyos.</p>
      <div class="ulist">${users.map(u => { const sup = (u.email||'').toLowerCase()===SUPER, co = creators.includes(u.uid);
        return `<div class="urow"><span class="e"><strong>${escH(u.name||u.email)}</strong><small>${escH(u.email)} · último acceso ${escH(fmtD(u.lastSeen))}</small></span>
          ${sup?'<span class="tag">Superadmin</span>':co?`<button class="btn link danger" data-unco="${escH(u.uid)}" data-nm="${escH(u.email)}">Quitar coadmin</button>`:`<button class="btn" data-co="${escH(u.uid)}" data-nm="${escH(u.email)}">Hacer coadmin</button>`}</div>`; }).join('') || '<p>Nadie ha entrado todavía.</p>'}</div>
    </div>
    <div class="gcard">
      <h2>Grupos (${groups.length})</h2>
      <div class="ulist">${groups.map(g => { const cr = users.find(u=>u.uid===g.createdBy);
        return `<div class="urow" id="row-${escH(g.id)}"><span class="e"><strong>${escH(g.name||'Grupo')}</strong><small>${(g.members||[]).length} miembros · creado por ${escH(cr?cr.email:'—')}</small></span><span class="row" style="gap:6px;flex-wrap:nowrap"><button class="btn" data-g="${escH(g.id)}">Entrar</button><button class="btn link danger" data-gdel="${escH(g.id)}" data-nm="${escH(g.name||'Grupo')}">Borrar</button></span></div>`; }).join('') || '<p>No hay grupos.</p>'}</div>
    </div>`;
  document.getElementById('sBack').onclick = () => { history.replaceState(null,'',location.pathname); showHome(); };
  gb().querySelectorAll('[data-g]').forEach(b => b.onclick = () => openGroup(b.dataset.g));
  gb().querySelectorAll('[data-gdel]').forEach(b => b.onclick = () => {
    const gid = b.dataset.gdel, row = document.getElementById('row-'+gid);
    row.innerHTML = `<span class="e"><strong>¿Borrar «${escH(b.dataset.nm)}»?</strong><small>Se borrarán su clasificación, partidos, convocatorias y torneos. No se puede deshacer.</small></span><span class="row" style="gap:6px;flex-wrap:nowrap"><button class="btn" data-gno>Cancelar</button><button class="btn" data-gyes style="background:var(--loss);border-color:var(--loss);color:#fff">Sí, borrar</button></span>`;
    row.querySelector('[data-gno]').onclick = () => showSuper();
    row.querySelector('[data-gyes]').onclick = async () => {
      row.innerHTML = '<span class="e">Borrando…</span>';
      try { await deleteGroupAll(gid); showSuper(`Grupo «${b.dataset.nm}» borrado.`); }
      catch(e){ showSuper('No se ha podido borrar: '+(e.message||e.code)); }
    };
  });
  const setCreators = async list => { try { await fs.doc('config/app').set({creators:list, at:Date.now()}, {merge:true}); appCfg.creators = list; showSuper('Cambios guardados.'); } catch(e){ showSuper('No se ha podido guardar: '+(e.message||e.code)); } };
  gb().querySelectorAll('[data-co]').forEach(b => b.onclick = () => setCreators([...new Set([...creators, b.dataset.co])]));
  gb().querySelectorAll('[data-unco]').forEach(b => b.onclick = () => setCreators(creators.filter(x=>x!==b.dataset.unco)));
}

async function openGroup(gid){
  let snap;
  try { snap = await fs.doc('groups/'+gid).get(); } catch(e){ snap = null; }
  if (!snap || !snap.exists){ history.replaceState(null,'',location.pathname); try{localStorage.removeItem('ptg_group')}catch(_){} return showHome('Ese grupo ya no existe.'); }
  const g = snap.data();
  if (isSuper && !g.createdBy){ // grupo creado con la versión anterior: lo adapta
    const cb = g.owner || user.uid;
    try { await fs.doc('groups/'+gid).update({createdBy:cb, members:FV.arrayUnion(cb), admins:FV.arrayUnion(cb)}); Object.assign(g,{createdBy:cb, members:[...new Set([...(g.members||[]),cb])], admins:[...new Set([...(g.admins||[]),cb])]}); } catch(_){}
  }
  if (!isMemberOf(g)){ history.replaceState(null,'',location.pathname); try{localStorage.removeItem('ptg_group')}catch(_){} return showHome(`Todavía no formas parte de «${g.name||'este grupo'}». Pide acceso abajo.`, gid); }
  group = gid; groupData = g;
  try{ localStorage.setItem('ptg_group', gid); }catch(_){}
  if (new URLSearchParams(location.search).get('g')!==gid) history.replaceState(null,'', location.pathname+'?g='+gid+location.hash);
  fs.doc('groups/'+gid).onSnapshot(s => { if (s.exists) { groupData = s.data(); refresh(); } }, ()=>{});
  fs.collection('groups/'+gid+'/players').onSnapshot(q => q.docs.forEach(d => { const x=d.data(); if (x.uid && x.photo) photos[x.uid]=x.photo; }), ()=>{});
  if (isAdminOf(g)) {
    fs.collection('groups/'+gid+'/requests').onSnapshot(q => { window.groupApi.requests = q.docs.map(d=>({uid:d.id, ...d.data()})).sort((a,b)=>(a.at||0)-(b.at||0)); refresh(); }, ()=>{});
    fs.collection('groups/'+gid+'/members').onSnapshot(q => { window.groupApi.members = q.docs.map(d=>({uid:d.id, ...d.data()})).sort((a,b)=>(a.email||'').localeCompare(b.email||'')); refresh(); }, ()=>{});
  }
  const db = makeDb(gid), usr = makeUser();
  window.claude = { use: async n => n==='db' ? db : n==='user' ? usr : null };
  document.body.classList.remove('gated');
  window.startApp();
}

auth.getRedirectResult().catch(() => {});
auth.onAuthStateChanged(async u => {
  if (!u) return showLogin();
  user = u; isSuper = !!SUPER && myEmail()===SUPER;
  gb().innerHTML = '<p class="muted">Cargando…</p>';
  try { await fs.doc('users/'+u.uid).set({email:myEmail(), name:u.displayName||'', photo:u.photoURL||null, lastSeen:Date.now()}, {merge:true}); } catch(_){}
  try { const c = await fs.doc('config/app').get(); if (c.exists) appCfg = {creators:[], ...c.data()}; } catch(_){}
  const qs = new URLSearchParams(location.search), want = qs.get('g');
  let last = null; try{ last = localStorage.getItem('ptg_group'); }catch(_){}
  if (qs.get('panel')==='super' && isSuper) showSuper();
  else if (want) openGroup(want); else if (last) openGroup(last); else showHome();
});
})();
</script>

<script>(function(){ const cur=(document.querySelector('meta[name=app-version]')||{}).content; let shown=false; const check=()=>{ if(shown||!cur) return; fetch('index.html?v='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.text():'').then(t=>{ const m=t.match(/name="app-version" content="([^"]+)"/); if(m&&m[1]!==cur){ shown=true; const d=document.createElement('div'); d.className='updbar'; d.innerHTML='<span>Hay una versión nueva de la app</span><button class="btn primary" type="button">Actualizar</button>'; d.querySelector('button').onclick=()=>location.reload(); document.body.appendChild(d); } }).catch(()=>{}); }; setTimeout(check, 4000); setInterval(check, 10*60*1000); document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') check(); }); })();</script>
