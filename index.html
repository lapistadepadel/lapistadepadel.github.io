<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f5ba3">
<meta name="app-version" content="20261110160245">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Pádel">
<title>Pádel entre amigos</title>
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px Arial,Helvetica,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: app shell. Sticky top bar with brand + pill nav (desktop), fixed bottom tab bar (phone), one 760px working column. Dark "ink" hero cards carry the key number of each view. */
:root{
  --bg:#f1f3f6; --surface:#ffffff; --surface-2:#e9edf2; --line:#dde3ea;
  --fg:#0f1a26; --muted:#5d6b7a;
  --ink:#0f1b2a; --ink-2:#1a2a3e; --ink-fg:#f2f5f8; --ink-muted:#93a3b6; --ink-line:rgba(255,255,255,.13);
  --court:#1f5ba3; --court-deep:#173f72; --court-soft:#e3ecf7;
  --ball:#dfe63a; --ball-ink:#212500;
  --win:#1d7a4c; --win-bg:#e2f2e9; --loss:#b5392d; --loss-bg:#f8e5e2;
  --gold:#e8bb2a; --silver:#b8c3ce; --bronze:#cb8448;
  --focus:#2f7de1; --chart:#1f5ba3;
  --f-display:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-score:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a1119; --surface:#121c27; --surface-2:#1a2634; --line:#243344;
  --fg:#e8eef4; --muted:#8e9fb1;
  --ink:#16243a; --ink-2:#1f3049; --ink-fg:#f2f5f8; --ink-muted:#9fb0c4; --ink-line:rgba(255,255,255,.12);
  --court:#3c7dd1; --court-deep:#2a5e9f; --court-soft:#18304c;
  --ball:#d9e03a; --ball-ink:#1f2300;
  --win:#5cc58f; --win-bg:#163226; --loss:#ef8a7e; --loss-bg:#3a1e1b;
  --focus:#6aa8f5; --chart:#7fb4f2; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0a1119; --surface:#121c27; --surface-2:#1a2634; --line:#243344;
  --fg:#e8eef4; --muted:#8e9fb1;
  --ink:#16243a; --ink-2:#1f3049; --ink-fg:#f2f5f8; --ink-muted:#9fb0c4; --ink-line:rgba(255,255,255,.12);
  --court:#3c7dd1; --court-deep:#2a5e9f; --court-soft:#18304c;
  --ball:#d9e03a; --ball-ink:#1f2300;
  --win:#5cc58f; --win-bg:#163226; --loss:#ef8a7e; --loss-bg:#3a1e1b;
  --focus:#6aa8f5; --chart:#7fb4f2; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
a{color:inherit}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
h2{font-family:var(--f-display);font-weight:800;font-size:24px;margin:0;letter-spacing:-.01em;text-wrap:balance}
h3{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:700}
.muted{color:var(--muted)} .small{font-size:13px}
.stack{display:flex;flex-direction:column;gap:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}

/* Top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:12px;min-height:60px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0;flex:1}
.mark{width:34px;height:34px;border-radius:10px;background:var(--court);position:relative;flex:none;overflow:hidden}
.mark::before{content:"";position:absolute;inset:7px 5px;border:1.5px solid rgba(255,255,255,.75);border-radius:2px}
.mark::after{content:"";position:absolute;left:50%;top:7px;bottom:7px;border-left:1.5px solid rgba(255,255,255,.75)}
.mark i{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--ball);right:4px;top:4px;z-index:1;box-shadow:0 0 0 2px var(--court)}
#leagueName{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0}
.btn-new{background:var(--ball);color:var(--ball-ink);border-radius:999px;padding:9px 16px;font-weight:700;font-size:14px;text-decoration:none;white-space:nowrap}
.btn-new:hover{filter:brightness(1.04)}
.pillnav{display:flex;gap:4px;padding:4px;background:var(--surface-2);border-radius:999px;margin:12px 0 0;overflow-x:auto}
.pillnav a{flex:1;text-align:center;padding:9px 12px;border-radius:999px;text-decoration:none;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.pillnav a[aria-current="page"]{background:var(--ink);color:var(--ink-fg)}
.bottomnav{display:none}
@media (max-width:640px){
  .pillnav,.topbar .btn-new{display:none}
  .bottomnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .bottomnav a{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:4px 0;position:relative}
  .bottomnav a svg{width:24px;height:24px}
  .bottomnav a[aria-current="page"]{color:var(--court)}
  .bottomnav a[aria-current="page"]::before{content:"";position:absolute;top:-7px;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--court)}
  .bottomnav a.plus span.p{width:46px;height:46px;border-radius:50%;background:var(--ball);color:var(--ball-ink);display:grid;place-items:center;margin-top:-18px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
  .bottomnav a.plus span.p svg{width:22px;height:22px}
  .bottomnav a.plus[aria-current="page"]::before{display:none}
  main{padding-bottom:24px!important}
  footer{padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))!important}
}
main{padding-block:20px 48px}

/* Generic surfaces and controls */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:700;font-size:14px;cursor:pointer}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--ink-fg)}
.btn.primary:hover{background:var(--ink-2)}
.btn.danger{color:var(--loss)}
.btn.link{border:0;background:none;padding:4px 6px;color:var(--muted);font-weight:600;text-decoration:underline;text-underline-offset:3px;border-radius:6px}
.btn:disabled{opacity:.55;cursor:not-allowed}
input[type=text],input[type=date],input[type=number],select{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;min-width:0}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.note{padding:12px 16px;border-radius:var(--r-sm);background:var(--surface-2);font-size:14px}
.note.err{background:var(--loss-bg);color:var(--loss)} .note.ok{background:var(--win-bg);color:var(--win)}
.seg{display:inline-flex;gap:3px;padding:3px;background:var(--surface-2);border-radius:999px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tag{font-size:11px;font-weight:700;letter-spacing:.04em;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.av{width:30px;height:30px;border-radius:50%;flex:none;display:inline-grid;place-items:center;font-size:12px;font-weight:700;color:#fff;background:var(--muted);overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.av.lg{width:60px;height:60px;font-size:22px}
.pname{display:flex;align-items:center;gap:10px;font-weight:600;min-width:0}
.form{display:inline-flex;gap:3px}
.form i{width:8px;height:8px;border-radius:50%;display:inline-block}
.form i.G{background:var(--win)} .form i.P{background:var(--loss)} .form i.E{background:var(--muted);opacity:.55}
.team.d .names{color:var(--fg)}
.pos-up{color:var(--win)} .pos-down{color:var(--loss)}
.empty{text-align:center;padding:36px 18px}
.empty .court{width:110px;height:64px;margin:0 auto 14px;border:2px solid var(--line);border-radius:4px;position:relative}
.empty .court::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:2px solid var(--line)}
.empty .court::after{content:"";position:absolute;left:20%;right:20%;top:50%;border-top:2px solid var(--line)}
footer{padding-block:0 30px;font-size:13px;color:var(--muted)}

/* Ink hero card */
.hero{background:var(--ink);color:var(--ink-fg);border-radius:22px;padding:22px;position:relative;overflow:hidden}
.hero .eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ball)}
.hero .deco{position:absolute;right:-1px;top:-1px;width:170px;height:120px;border:1.5px solid var(--ink-line);border-top:0;border-right:0;pointer-events:none}
.hero .deco::before{content:"";position:absolute;left:44px;top:0;bottom:0;border-left:1.5px solid var(--ink-line)}
.hero .deco::after{content:"";position:absolute;left:44px;right:0;top:55px;border-top:1.5px solid var(--ink-line)}
.hero .big{font-family:var(--f-display);font-weight:800;font-size:64px;line-height:.95;letter-spacing:-.03em;margin-top:14px;position:relative}
.hero .big small{font-size:22px;font-weight:700;color:var(--ink-muted);letter-spacing:0;margin-left:6px}
.hero .who{display:flex;align-items:center;gap:12px;position:relative}
.hero .who .nm{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1.1}
.hero .pill{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:5px 12px;border-radius:999px;border:1px solid var(--ink-line);color:var(--ink-fg);background:var(--ink-2)}
.hero .pill.y{background:transparent;border-color:color-mix(in srgb,var(--ball) 50%,transparent);color:var(--ball)}
.hstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:20px;padding-top:18px;border-top:1px solid var(--ink-line);position:relative}
.hstats .k{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-muted)}
.hstats .v{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.hbar{height:6px;border-radius:99px;background:var(--ink-2);margin-top:16px;overflow:hidden;position:relative}
.hbar i{display:block;height:100%;background:var(--ball);border-radius:99px}
.hero .cta{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:18px;background:var(--ball);color:var(--ball-ink);border-radius:999px;padding:14px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;font-size:14px;position:relative}

/* Ranking list */
.rhead{display:grid;grid-template-columns:44px 1fr 56px 64px;gap:10px;padding:0 16px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.rhead span:nth-child(n+3){text-align:right}
.rlist{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.rrow{display:grid;grid-template-columns:44px 1fr 56px 64px;gap:10px;align-items:center;padding:12px 16px;text-decoration:none;border-top:1px solid var(--line)}
.rrow:first-child{border-top:0}
.rrow:hover{background:var(--surface-2)}
.rrow.mine{background:var(--court-soft)}
.rrow.idle{color:var(--muted)}
.rpos{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:16px;color:var(--muted);font-variant-numeric:tabular-nums}
.rpos.p1{background:var(--ink);color:var(--ball)} .rpos.p2{background:var(--court);color:#fff} .rpos.p3{background:var(--surface-2);color:var(--fg)}
.rwho{display:flex;align-items:center;gap:12px;min-width:0}
.rwho .av{width:42px;height:42px;font-size:15px}
.rwho .nm{font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rwho .meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-top:2px}
.rnum{text-align:right;font-family:var(--f-display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.rpct{text-align:right;font-family:var(--f-display);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.rpct small{font-size:11px;color:var(--muted);font-weight:600}
.rpct .sub{display:block;font-family:var(--f-body);font-size:11px;font-weight:600;color:var(--muted)}

/* Court visual */
.courtviz{margin-top:18px;border:2px solid color-mix(in srgb,var(--ink-fg) 45%,transparent);border-radius:6px;background:var(--court-deep);position:relative;overflow:hidden}
.courtviz .net{height:10px;background:repeating-linear-gradient(90deg,var(--ink-line) 0 2px,transparent 2px 7px),var(--ink-2);border-bottom:2px solid color-mix(in srgb,var(--ink-fg) 45%,transparent)}
.courtviz .halves{display:grid;grid-template-columns:1fr 1fr}
.courtviz .half{padding:26px 10px 22px;text-align:center}
.courtviz .half+.half{border-left:2px solid color-mix(in srgb,var(--ink-fg) 45%,transparent)}
.courtviz .half .k{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:color-mix(in srgb,var(--ink-fg) 75%,transparent)}
.courtviz .half .v{font-family:var(--f-display);font-weight:800;font-size:clamp(40px,11vw,58px);line-height:1;letter-spacing:-.03em;margin:8px 0 4px}
.courtviz .half.hl .v{color:var(--ball)}
.courtviz .half .s{font-size:13px;color:color-mix(in srgb,var(--ink-fg) 70%,transparent)}
.courtviz .back{display:grid;grid-template-columns:1fr 1fr;border-top:2px solid color-mix(in srgb,var(--ink-fg) 45%,transparent);padding:16px 10px;text-align:center;background:radial-gradient(60% 120% at 75% 50%,color-mix(in srgb,var(--ball) 22%,transparent),transparent 70%)}
.courtviz .back span{justify-self:center;font-family:var(--f-score);font-weight:600;font-size:18px;padding:4px 14px;border-radius:999px;background:var(--ink-2);color:var(--ink-fg)}
.courtviz .back span.y{background:var(--ball);color:var(--ball-ink)}
.minis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.mini{background:var(--ink-2);border-radius:14px;padding:14px 16px}
.mini .k{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-muted)}
.mini .v{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1.1}
.mini .v.y{color:var(--ball)}

/* Tiles, cards, misc */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:620px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.tile .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.tile .v{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1.15;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:620px){.grid2{grid-template-columns:1fr}}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.bar{display:inline-block;vertical-align:middle;width:70px;height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-right:8px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--chart)}
.bar.g i{background:var(--win)}
.strip{display:flex;gap:4px;height:120px;align-items:stretch}
.strip .c{flex:1 1 0;max-width:26px;display:flex;flex-direction:column;min-width:6px}
.strip .up,.strip .dn{flex:1;display:flex}
.strip .up{align-items:flex-end;border-bottom:1px solid var(--line)}
.strip .dn{align-items:flex-start}
.strip .up i,.strip .dn i{display:block;width:100%;min-height:6px}
.strip .up i{background:var(--win);border-radius:5px 5px 0 0}
.strip .dn i{background:var(--loss);border-radius:0 0 5px 5px}
.split{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--surface-2);margin-top:12px}
.split i{display:block;height:100%}
.avs{display:inline-flex;flex:none}
.avs .av{width:26px;height:26px;font-size:10px;box-shadow:0 0 0 2px var(--surface)}
.avs .av+.av{margin-left:-7px}

/* Match cards */
.day{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:8px 0 -6px}
.match{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:center}
.team{display:flex;align-items:center;gap:10px;min-width:0;font-weight:600}
.team .names{overflow-wrap:anywhere}
.team.w .names{color:var(--fg);font-weight:700}
.team:not(.w) .names{color:var(--muted)}
.team.w::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--ball);box-shadow:0 0 0 1.5px var(--ball-ink) inset;flex:none}
.sets{display:flex;gap:10px;font-family:var(--f-score);font-weight:600;font-size:24px;font-variant-numeric:tabular-nums;justify-content:flex-end}
.sets span{min-width:16px;text-align:center}
.sets span.b{font-weight:700} .sets span.lo{color:var(--muted)}
.mfoot{grid-column:1/-1;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;margin-top:2px}

/* New match form */
.pairs{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:start}
@media (max-width:620px){.pairs{grid-template-columns:1fr}.vs{text-align:center}}
.pair{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:var(--r);background:var(--surface-2)}
.vs{font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--muted);align-self:center}
.score{display:grid;grid-template-columns:auto repeat(3,60px);gap:8px;align-items:center;font-variant-numeric:tabular-nums}
.score input{text-align:center;font-family:var(--f-score);font-size:22px;font-weight:600;padding:6px 4px;width:100%}
.score .h{font-size:11px;color:var(--muted);font-weight:700;text-align:center;letter-spacing:.08em;text-transform:uppercase}
.score .t{font-weight:600;font-size:14px;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.h2h{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;text-align:center}
.h2h .big{font-family:var(--f-display);font-weight:800;font-size:52px;line-height:1}
.hero .muted{color:var(--ink-muted)}
.hero .h2h select{background:var(--ink-2);color:var(--ink-fg);border-color:var(--ink-line)}

/* Tournaments */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.chip.live{background:var(--win-bg);color:var(--win)}

.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-radius:999px;padding:14px 18px;font-weight:800;font-size:15px;cursor:pointer;background:var(--ball);color:var(--ball-ink)}

.glist{display:flex;flex-direction:column;gap:8px}

/* ===== Look & feel v2: light-green cards, Arial everywhere, menus in Arial Black ===== */
:root{
  --ink:#e4f4e9; --ink-2:#cfeadb; --ink-fg:#11301f; --ink-muted:#4d6b5a; --ink-line:rgba(17,48,31,.14);
  --ink-accent:#1b7a47; --primary:#1b7a47; --primary-fg:#ffffff;
  --f-display:Arial,Helvetica,sans-serif; --f-score:Arial,Helvetica,sans-serif; --f-body:Arial,Helvetica,sans-serif;
  --f-menu:"Arial Black","Arial Bold",Arial,Helvetica,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --ink-accent:#7ed6a0; --primary:#2f9a5e;
}}
:root[data-theme="dark"]{

}
.hero,.champ,.gcard{border:1px solid color-mix(in srgb,var(--ink-accent) 22%,transparent)}
.hero .eyebrow,.evdate .m{color:var(--ink-accent)}
.hero .pill.y{border-color:color-mix(in srgb,var(--ink-accent) 50%,transparent);color:var(--ink-accent)}
.hbar i{background:var(--ink-accent)}
.hero .cta{background:var(--primary);color:var(--primary-fg)}
.rpos.p1{background:var(--ink);color:var(--ink-accent);box-shadow:inset 0 0 0 1.5px var(--ink-accent)}
.mini .v.y{color:var(--ink-accent)}
.adminbadge{background:var(--ink-accent);color:#fff}
.cday.sel::after{background:var(--ink-accent)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-fg)}
.btn.primary:hover{background:var(--primary);filter:brightness(1.07)}
.courtviz{border-color:rgba(255,255,255,.7)}
.courtviz .net{background:repeating-linear-gradient(90deg,rgba(255,255,255,.25) 0 2px,transparent 2px 7px),rgba(0,0,0,.18);border-bottom-color:rgba(255,255,255,.7)}
.courtviz .half+.half{border-left-color:rgba(255,255,255,.7)}
.courtviz .back{border-top-color:rgba(255,255,255,.7)}
.courtviz .half .k{color:rgba(255,255,255,.82)} .courtviz .half .v{color:#fff} .courtviz .half.hl .v{color:var(--ball)} .courtviz .half .s{color:rgba(255,255,255,.75)}
.courtviz .back span{background:rgba(255,255,255,.16);color:#fff}
.courtviz .back span.y{background:var(--ball);color:var(--ball-ink)}
.pillnav a,.bottomnav a,.seg button,#leagueName,.gbrand,.btn-new,.calhead .mn,.opts .opt{font-family:var(--f-menu);font-weight:900}
.pillnav a{letter-spacing:.03em;font-size:12px}
.bottomnav a{letter-spacing:.02em}
h2,.hero .big,.courtviz .half .v,.h2h .big{letter-spacing:-.01em}
.gitem{background:var(--ink-2);color:var(--ink-fg)}
.gitem small{color:var(--ink-muted)}
.gform input,.gform select{flex:1 1 180px;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;min-width:0}
.gcard .btn{background:var(--surface)}
.gcard .btn.primary{background:var(--primary);color:var(--primary-fg)}
.gcard .muted,.gcard p{color:var(--ink-muted)}
.gbtn.light{border:1px solid var(--line)}
.pending{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--surface);color:var(--fg);font-size:14px}
.ulist{display:flex;flex-direction:column;gap:6px;max-height:60vh;overflow:auto}
.urow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:12px;background:var(--surface);color:var(--fg)}
.urow .e{font-size:13px;overflow-wrap:anywhere;min-width:0}
.urow .e small{display:block;color:var(--muted)}

/* ===== Look & feel v3: Material-style, calm and minimal ===== */
:root{
  --bg:#f4f7f5; --surface:#ffffff; --surface-2:#edf2ee; --line:#e2e8e3; --fg:#18231d; --muted:#5f6d65;
  --ink:#dff2e6; --ink-2:#cbe8d5; --ink-fg:#0e2a1a; --ink-muted:#4c6a58; --ink-accent:#16794a;
  --primary:#16794a; --primary-fg:#ffffff; --tonal:#d4eedd; --tonal-fg:#0c3a22;
  --court-soft:#e8f0fb;
  --elev1:0 1px 2px rgba(20,40,28,.06),0 1px 3px 1px rgba(20,40,28,.04);
  --elev2:0 2px 6px rgba(20,40,28,.08),0 1px 2px rgba(20,40,28,.06);
  --r:20px; --r-sm:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1512; --surface:#18201b; --surface-2:#202a24; --line:#2b3730; --fg:#e3ebe6; --muted:#9aaaa1;
  --ink:#1d3426; --ink-2:#264331; --ink-fg:#e6f4ea; --ink-muted:#a7c3b1; --ink-accent:#83d9a5;
  --primary:#3aa66b; --primary-fg:#ffffff; --tonal:#25402f; --tonal-fg:#cfeedd; --court-soft:#1b2a3a;
  --elev1:0 1px 2px rgba(0,0,0,.4); --elev2:0 2px 6px rgba(0,0,0,.45);
}}
:root[data-theme="dark"]{
  --bg:#0f1512; --surface:#18201b; --surface-2:#202a24; --line:#2b3730; --fg:#e3ebe6; --muted:#9aaaa1;
  --ink:#1d3426; --ink-2:#264331; --ink-fg:#e6f4ea; --ink-muted:#a7c3b1; --ink-accent:#83d9a5;
  --primary:#3aa66b; --primary-fg:#ffffff; --tonal:#25402f; --tonal-fg:#cfeedd; --court-soft:#1b2a3a;
  --elev1:0 1px 2px rgba(0,0,0,.4); --elev2:0 2px 6px rgba(0,0,0,.45);
}
body{font-size:15px;line-height:1.5}
main{padding-block:16px 48px}
.stack{gap:16px}
h2{font-size:22px;font-weight:700}
h3{font-size:11px;letter-spacing:.08em;font-weight:700;color:var(--muted)}

/* surfaces: no hard borders, soft elevation */
.panel,.rlist,.match,.tile,.ev,.gpanel,.tcard,.cal,.bm{border:0;box-shadow:var(--elev1);border-radius:var(--r)}
.panel{padding:20px}
.match{padding:16px 18px}
.mfoot{border-top-color:var(--surface-2)}
.rrow{border-top:0;padding:14px 18px;position:relative}
.rrow+.rrow::before{content:"";position:absolute;left:84px;right:18px;top:0;border-top:1px solid var(--surface-2)}
.rrow.mine{background:var(--tonal)}
.rrow.mine .rwho .nm,.rrow.mine .rnum{color:var(--tonal-fg)}
.rhead{padding:0 18px}
.kv{border-bottom-color:var(--surface-2)}

/* hero cards */
.hero{border:0;border-radius:28px;padding:24px;box-shadow:none}
.hero .deco{opacity:.55}
.hero .big{font-size:52px;font-weight:700;margin-top:10px}
.hero .big.sm{font-size:30px;margin-top:12px}
.hero .big small{font-size:18px}
.hero .pill{border:0;background:var(--ink-2);font-size:11px;padding:6px 12px}
.hero .pill.y{background:var(--surface);color:var(--ink-accent)}
.hstats{border-top-color:var(--ink-line);margin-top:18px;padding-top:16px}
.hstats .v{font-size:26px;font-weight:700}
.hbar{background:var(--surface);height:8px}
.mini{background:var(--surface);border-radius:16px}
.mini .v{font-weight:700}
.courtviz{border-radius:14px;border-width:2px}
.champ{border:0;border-radius:28px}

/* buttons: filled / tonal / text */
.btn{border:0;background:var(--surface-2);color:var(--fg);border-radius:999px;min-height:40px;padding:10px 18px;font-weight:700;font-size:14px;transition:background .15s, box-shadow .15s}
.btn:hover{background:var(--line)}
.btn.primary{background:var(--primary);color:var(--primary-fg);box-shadow:none}
.btn.primary:hover{background:var(--primary);box-shadow:var(--elev2);filter:none}
.btn.danger{background:transparent;color:var(--loss);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--loss) 45%,transparent)}
.btn.link{min-height:0;background:none;padding:6px 8px;text-decoration:none;color:var(--ink-accent);font-weight:700}
.btn.link:hover{background:var(--surface-2)}
.btn.link.danger{color:var(--loss);box-shadow:none}
.btn.wa{background:#25d366;color:#05311a}
.evacts .btn{min-height:36px;padding:8px 14px}

/* inputs: filled */
input[type=text],input[type=date],input[type=number],input[type=email],input[type=time],select{background:var(--surface-2);border:0;border-radius:var(--r-sm);padding:11px 14px;box-shadow:inset 0 -1px 0 var(--line)}
input:focus-visible,select:focus-visible{outline:2px solid var(--primary);outline-offset:0}
label.f{font-size:11px;letter-spacing:.06em}
.pair,.slotg{background:var(--surface-2);border:0}
.score input{background:var(--surface)}

/* chips and tags */
.tag,.chip{background:var(--surface-2);color:var(--muted);font-weight:700}
.chip.live{background:var(--tonal);color:var(--tonal-fg)}
.full{background:var(--tonal);color:var(--tonal-fg)}
.seg{background:var(--surface-2);padding:4px}
.seg button{font-size:11px;padding:8px 14px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--elev1)}

/* top app bar and navigation */
.topbar{background:var(--surface);border-bottom:0;box-shadow:var(--elev1);backdrop-filter:none}
.topbar .wrap{min-height:64px}
.mark{border-radius:12px}
.btn-new{background:var(--primary);color:var(--primary-fg);padding:10px 18px}
.pillnav{background:transparent;padding:0;margin:14px 0 0;gap:6px}
.pillnav a{background:transparent;color:var(--muted);padding:10px 16px}
.pillnav a:hover{background:var(--surface-2)}
.pillnav a[aria-current="page"]{background:var(--tonal);color:var(--tonal-fg)}
@media (max-width:640px){
  .bottomnav{border-top:0;box-shadow:0 -1px 3px rgba(20,40,28,.06);padding-top:10px}
  .bottomnav a{gap:4px;color:var(--muted)}
  .bottomnav a svg{width:22px;height:22px;padding:4px 18px;border-radius:999px;box-sizing:content-box;transition:background .15s}
  .bottomnav a[aria-current="page"]{color:var(--fg)}
  .bottomnav a[aria-current="page"] svg{background:var(--tonal);color:var(--tonal-fg)}
  .bottomnav a[aria-current="page"]::before{display:none}
  .bottomnav a.plus span.p{background:var(--primary);color:#fff;border-radius:18px;width:54px;height:54px;margin-top:-26px;box-shadow:var(--elev2)}
  .bottomnav a.plus span.p svg{padding:0;background:none!important;color:#fff!important;width:24px;height:24px}
}

/* calendar and sign-ups */
.cal{padding:16px}
.calnav{border:0;background:var(--surface-2)}
.cday{border-radius:999px}
.cday.today{box-shadow:inset 0 0 0 1.5px var(--primary)}
.cday.sel{background:var(--primary);color:#fff}
.cday.sel::after{background:#fff}
.evdate{background:var(--ink);color:var(--ink-fg)}
.evblock{background:var(--surface-2);border-radius:16px}
.evblock.beerb{background:color-mix(in srgb,var(--ball) 18%,var(--surface))}
.ask{background:transparent;padding:0}
.opt{border:0;background:var(--surface-2);min-height:38px;padding:8px 16px}
.opt[aria-pressed="true"].yes{background:var(--win);color:#fff}
.pairsbox{background:var(--court-soft);border-radius:16px}
.places .free{border-color:var(--line)}

/* gate */
.gcard{border:0;border-radius:28px;box-shadow:none}
.gitem{background:var(--surface);color:var(--fg);box-shadow:var(--elev1)}
.gitem small{color:var(--muted)}
.urow,.pending{box-shadow:var(--elev1)}
.gbtn.light{border:0;box-shadow:var(--elev2)}

/* misc */
.note{border-radius:16px;background:var(--surface-2)}
.note.ok{background:var(--tonal);color:var(--tonal-fg)}
.mbox{border-radius:28px}
.empty .court{border-color:var(--line)}

.updbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;align-items:center;gap:14px;background:var(--fg);color:var(--bg);padding:10px 10px 10px 18px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.25);font-weight:700;font-size:14px;max-width:calc(100% - 32px);white-space:nowrap;width:max-content}
.updbar span{overflow:hidden;text-overflow:ellipsis}
@media (max-width:640px){.updbar{bottom:calc(92px + env(safe-area-inset-bottom,0px))}}
/* ===== v5: Hoy, single accent colour, steppers, toasts, welcome ===== */
:root{--warn:#e8bb2a;--ball-y:#dfe63a}

/* top bar settings button */
.gearbtn{pointer-events:auto;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--fg);background:var(--surface);box-shadow:var(--elev1);flex:none;text-decoration:none;position:relative;z-index:2}
.gearbtn:hover{background:var(--surface-2)}
@media (max-width:640px){.topbar .wrap{justify-content:space-between}}
.iconbtn{width:40px;height:40px;border-radius:50%;display:inline-grid;place-items:center;border:0;background:var(--surface);box-shadow:var(--elev1);color:var(--fg);cursor:pointer;text-decoration:none;flex:none}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn.info{font-family:Georgia,serif;font-style:italic;font-weight:700;font-size:17px;color:var(--muted)}
.pagehead{display:flex;align-items:center;gap:10px}

/* bottom nav: five equal items with a raised + in the middle */
@media (max-width:640px){
  .bottomnav a{font-family:var(--f-menu,'Arial Black',Arial,sans-serif);font-weight:900;font-size:10px;letter-spacing:.03em}
}

/* eyebrow labels */
.eyb{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--primary);display:inline-flex;align-items:center;gap:7px}
.eyb.warn{color:#7a5a00}
.eyb .dot{width:8px;height:8px;border-radius:50%;background:var(--warn);display:inline-block}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .eyb.warn{color:#f0cf6a}}

/* Hoy */
.hoyhead{display:flex;flex-direction:column;gap:0;margin-bottom:-4px}
.hoyhead h2{font-size:28px}
.nextc{background:var(--ink);color:var(--ink-fg);border-radius:28px;padding:20px;display:flex;flex-direction:column;gap:14px}
.nextc .eyb{color:var(--ink-accent)}
.pill2{font-size:12px;font-weight:700;background:var(--surface);color:var(--primary);padding:5px 11px;border-radius:999px;white-space:nowrap}
.pill2.full{background:var(--primary);color:#fff}
.nwhen{font-size:26px;font-weight:800;line-height:1.1;letter-spacing:-.01em}
.nwhere{font-size:14px;color:var(--ink-muted);margin-top:4px}
.nbtns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.btn.bigb{min-height:50px;font-family:var(--f-menu,'Arial Black',Arial,sans-serif);font-weight:900;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.lightb{background:var(--surface);color:var(--fg)}
.btn.nobtn{background:var(--surface-2);color:var(--loss)}
.btn.nobtn.on{background:var(--loss);color:#fff}
.btn.primary.on{box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.btn.link.on{background:var(--surface);color:var(--fg)}
.nextc .btn.link{color:var(--ink-fg)}
.beerrow{display:flex;align-items:center;gap:10px;width:100%;min-height:46px;border:0;border-radius:16px;background:color-mix(in srgb,var(--surface) 70%,transparent);padding:0 14px;cursor:pointer;color:inherit;font:inherit;font-size:14px;font-weight:700;text-align:left}
.beerrow span{flex:1}
.beerrow strong{color:var(--primary);font-size:13px}
.beerrow.on{background:color-mix(in srgb,var(--ball-y) 40%,var(--surface))}
.beerrow.on strong{color:var(--fg)}
.beerrow .mug{width:18px;height:18px}

/* chips with face + name (sign-ups everywhere) */
.pchips{display:flex;flex-wrap:wrap;gap:6px}
.pchip{display:inline-flex;align-items:center;gap:7px;padding:4px 12px 4px 4px;border-radius:999px;background:var(--surface);font-size:13px;font-weight:700;color:var(--fg);box-shadow:var(--elev1);max-width:100%}
.pchip>span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pchip .av{width:28px;height:28px;font-size:11px;flex:none}
.pchip.free{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--muted);font-weight:600}
.nextc .pchip.free{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--primary) 45%,transparent);color:var(--ink-muted)}
.pchip.free .av{background:transparent!important;border:2px dashed currentColor;opacity:.6;box-sizing:border-box}
.evblock .pchip{background:var(--surface)}
.pchips.beers .pchip{background:color-mix(in srgb,var(--surface) 80%,transparent)}

/* cards on Hoy */
.hcard{background:var(--surface);border-radius:22px;padding:16px;box-shadow:var(--elev1);display:flex;flex-direction:column;gap:12px;text-decoration:none;color:inherit}
.board{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;font-variant-numeric:tabular-nums}
.board .tn{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--muted);min-width:0}
.board .tn>span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .tn.w{color:var(--fg);font-weight:700}
.board .tn .avs .av{width:26px;height:26px;font-size:10px}
.scs{display:flex;gap:5px}
.sc{width:30px;height:30px;border-radius:9px;background:var(--surface-2);color:var(--muted);display:grid;place-items:center;font-weight:800}
.sc.w{background:var(--primary);color:#fff}
.posc{flex-direction:row;align-items:center;gap:14px}
.posc:hover{box-shadow:var(--elev2)}
.pbig{display:flex;flex-direction:column;align-items:center;gap:4px;width:70px;flex:none}
.pn{font-size:40px;font-weight:800;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.pinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.pst{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.pst>span{display:flex;flex-direction:column}
.pst small{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.pst b{font-size:20px;font-variant-numeric:tabular-nums}
.pinfo .lead{color:var(--primary);font-weight:700}
.chv{color:var(--muted)}
.actc h3{margin:6px 0 8px 4px}
.actl{padding:4px 16px!important}
.acti{display:flex;align-items:center;gap:10px;padding:11px 0;font-size:14px}
.acti+.acti{border-top:1px solid var(--surface-2)}
.acti .av{width:30px;height:30px;font-size:11px;flex:none}
.aico{width:30px;height:30px;border-radius:50%;background:var(--tonal);color:var(--tonal-fg);display:grid;place-items:center;flex:none}
.atx{flex:1;min-width:0}
.ago{white-space:nowrap}

/* movement arrows in the ranking */
.rposw{display:flex;flex-direction:column;align-items:center;gap:2px}
.mv{font-size:10px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.mv.up{color:var(--primary)} .mv.dn{color:var(--loss)} .mv.eq{color:var(--muted);opacity:.7} .mv.nw{color:var(--court);text-transform:uppercase;font-size:8px;letter-spacing:.04em}
.pbig .mv{font-size:13px}
.rpos.p1,.rpos.p2,.rpos.p3{background:var(--surface-2);color:var(--fg)}
.rpos.p1{background:var(--ball-y);color:#3a3d00}
.rrow.mine .rpos{background:var(--primary);color:#fff}
.leadc{display:flex;align-items:center;gap:14px;background:var(--primary);color:#fff;border-radius:26px;padding:18px;position:relative;overflow:hidden;text-decoration:none}
.leadc::after{content:"";position:absolute;right:-34px;top:-34px;width:130px;height:130px;border-radius:50%;background:var(--ball-y);opacity:.22}
.leadc .av.lg{box-shadow:0 0 0 3px var(--ball-y)}
.leadc .eyb{color:var(--ball-y)}

<script>
(() => {
const K = 24, START = 1500;
const S = {
  db:null, user:null, uid:null, me:null, isOwner:false, canWrite:true,
  players:new Map(), matches:[], config:{}, ready:{p:false,m:false},
  status:'loading', slow:false, av:{}, flash:null, confirmDel:null,
  sortBy:'elo', period:'todo', h2h:{a:'',b:''}, busy:false, tournaments:new Map(), tEdit:null, tDel:null, tf:null, admins:[], modal:null, allPlayers:new Map(), events:new Map(), rsvp:new Map(), tres:new Map(), calMonth:null, calSel:null, ef:null, evDel:null, prefill:null
};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => { const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const rid = () => 'p' + Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const fmtDay = iso => { const [y,m,d] = iso.split('-').map(Number); const dt = new Date(y,m-1,d); return `${DIAS[dt.getDay()]} ${d} ${MESES[m-1]} ${y}`; };
const COLORS = ['#1d4f86','#7a3e9d','#1f7a4d','#b4541b','#9b2f4f','#3b6b7a','#6b5a1e','#2f5fb3'];
const colorFor = id => { let h=0; for (const c of id) h = (h*31 + c.charCodeAt(0))>>>0; return COLORS[h % COLORS.length]; };
const initials = n => (n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();

/* ---------- maths ---------- */
function result(m){
  let sa=0,sb=0,ga=0,gb=0;
  for (const [x,y] of m.sets||[]) { ga+=x; gb+=y; if (!validSet(x,y)) continue; if (x>y) sa++; else if (y>x) sb++; }  // an unfinished set counts its games but not as a set won
  const draw = sa===sb && ga===gb;
  const aWins = !draw && (sa!==sb ? sa>sb : ga>gb);
  return {sa,sb,ga,gb,aWins,draw};
}
const AUTO_MS = 4*3600*1000;   // a result nobody confirms or disputes is published after 4 hours
const autoPublished = m => m.confirmed===false && !m.disputed && (Date.now() - (m.at||0)) >= AUTO_MS;
const isCounted = m => m.confirmed!==false || autoPublished(m);
function autoLeft(m){ const tot = Math.max(1, Math.ceil(Math.max(0, AUTO_MS - (Date.now() - (m.at||0)))/60000)), h = Math.floor(tot/60), mi = tot%60; return h ? (mi ? `${h} h ${mi} min` : `${h} h`) : `${mi} min`; }
function compute(period, before){
  const st = new Map();
  for (const p of S.allPlayers.values()) st.set(p.id,{pj:0,pg:0,pe:0,sf:0,sc:0,gf:0,gc:0,form:[],log:[],partners:{},rivals:{},sd:{drive:{pj:0,pg:0},reves:{pj:0,pg:0}}});
  const ms = [...S.matches.filter(isCounted), ...tournamentMatches()].filter(m => [...m.a,...m.b].every(id => st.has(id)))
    .sort((x,y)=> (x.date||'').localeCompare(y.date||'') || (x.at||0)-(y.at||0))
    .filter(m => !period || period==='todo' || (m.date||'').startsWith(period==='mes'? today().slice(0,7) : today().slice(0,4)))
    .filter(m => !before || (m.date||'') < before);
  for (const m of ms){
    const r = result(m);
    const side = (team, opp, won, sf, sc, gf, gc) => {
      for (const id of team){
        const s = st.get(id); const mate = team.find(x=>x!==id);
        s.pj++; if (won) s.pg++; if (r.draw) s.pe++; s.sf+=sf; s.sc+=sc; s.gf+=gf; s.gc+=gc;
        s.form.push(r.draw?'E':won?'G':'P'); s.log.push({won, draw:r.draw, diff:gf-gc, date:m.date, sets:(m.sets||[]).map(([x,y])=> team===m.a? `${x}-${y}` : `${y}-${x}`).join(' ')});
        const sdv = m.sides && m.sides[id]; if (sdv==='drive'||sdv==='reves'){ s.sd[sdv].pj++; if (won) s.sd[sdv].pg++; }
        const pp = s.partners[mate] ||= {pj:0,pg:0,pe:0}; pp.pj++; if (won) pp.pg++; if (r.draw) pp.pe++;
        for (const o of opp){ const rr = s.rivals[o] ||= {pj:0,pg:0,pe:0}; rr.pj++; if (won) rr.pg++; if (r.draw) rr.pe++; }
      }
    };
    side(m.a,m.b, r.aWins, r.sa,r.sb,r.ga,r.gb);
    side(m.b,m.a,!r.aWins && !r.draw, r.sb,r.sa,r.gb,r.ga);
  }
  if (!before) S.lastC = {st, ms};
  return {st, ms, deltas:{}};
}
const pSets = s => s.sf+s.sc ? s.sf/(s.sf+s.sc) : 0;
const pGames = s => s.gf+s.gc ? s.gf/(s.gf+s.gc) : 0;
const pWins = s => s.pj ? s.pg/s.pj : 0;
const pc = v => Math.round(v*100) + '%';
function rankList(st){
  const arr = [...S.players.values()].map(p => ({p, s:st.get(p.id)}));
  const cmp = (a,b) => (b.s.pg-a.s.pg) || (b.s.pe-a.s.pe) || (pSets(b.s)-pSets(a.s)) || (pGames(b.s)-pGames(a.s));
  const active = arr.filter(x=>x.s.pj>0).sort((a,b)=> cmp(a,b) || (a.p.nick||'').localeCompare(b.p.nick||''));
  active.forEach((x,i)=>{ x.pos = (i>0 && cmp(active[i-1],x)===0) ? active[i-1].pos : i+1; });
  const idle = arr.filter(x=>x.s.pj===0).sort((a,b)=>(a.p.nick||'').localeCompare(b.p.nick||''));
  return {active, idle};
}

/* ---------- helpers for markup ---------- */
const isAdmin = () => S.isOwner || (!!S.uid && (S.admins||[]).includes(S.uid));
const nick = id => S.allPlayers.get(id)?.nick || 'Jugador';
const myPlayer = () => [...S.players.values()].find(p => p.uid && p.uid === S.uid);
function av(id, lg){
  const p = S.allPlayers.get(id);
  return `<span class="av${lg?' lg':''}" data-av="${esc(p?.uid||'')}" style="background:${colorFor(id)}">${esc(initials(p?.nick))}</span>`;
}
const pl = (id) => `<a href="#jugador-${esc(id)}" class="pname" style="text-decoration:none">${av(id)}<span>${esc(nick(id))}</span>${S.players.get(id)?.uid===S.uid&&S.uid?' <span class="tag">tú</span>':''}</a>`;

function paintAvatars(){

  const ids = [...new Set([...document.querySelectorAll('[data-av]')].map(e=>e.dataset.av).filter(Boolean))];
  if (!ids.length) return;

/* ---------- views ---------- */
function viewName(){ const h = location.hash.replace('#',''); return h || 'hoy'; }

function render(){
  const app = $('#app');
  $('#leagueName').textContent = S.config.name || 'Pádel entre amigos';
  for (const mk of [$('#brandMark'), $('#heroMark')]) { const lg = S.config.logo || ''; if (mk && mk.dataset.logo !== lg){ mk.dataset.logo = lg; mk.classList.toggle('haslogo', !!lg); mk.innerHTML = lg ? `<img src="${esc(lg)}" alt="">` : '<i></i>'; } }
  $('#heroName').textContent = S.config.name || 'Pádel entre amigos';
  { const hb = $('#heroBadge'), ab = $('#adminBadge'); if (hb && ab){ hb.hidden = ab.hidden; hb.textContent = ab.textContent; } }
  const v = viewName();
  const cur = (v.startsWith('editar-')||v==='partidos'||v==='evento-nuevo')?'calendario':v.startsWith('jugador-')?'clasificacion':v.startsWith('torneo')?'torneos':v;
  $('#adminBadge').hidden = !isAdmin(); $('#adminBadge').textContent = window.groupApi ? window.groupApi.role : (S.isOwner ? 'Admin' : 'Coadmin');
  document.querySelectorAll('#tabs a, #bnav a').forEach(a => { if (a.dataset.v===cur) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  const canNew = S.canWrite && S.status==='ready';
  $('#newTop').hidden = !canNew; $('#bnav .plus').hidden = !canNew; $('#gearTop').hidden = !(S.status==='ready' && S.uid); document.documentElement.dataset.view = v;

  if (S.status==='loading'){ app.innerHTML = S.slow ? `<div class="panel empty">${COURT_ART}<p class="muted">No consigo cargar los datos todavía. Revisa tu conexión; esta página se actualizará sola.</p></div>` : `<div class="stack skel" aria-busy="true" aria-label="Cargando"><div class="sk t"></div><div class="sk big"></div><div class="sk"></div><div class="sk"></div></div>`; foot(); return; }
  if (S.status==='nodb'){ app.innerHTML = `<div class="panel empty">${COURT_ART}<h2>Entra con tu cuenta</h2><p class="muted">La clasificación es privada del grupo. Entra con tu Gmail desde el enlace del grupo.</p></div>`; foot(); return; }
  if (S.status==='error'){ app.innerHTML = `<div class="note err">Se ha perdido la conexión con los datos. Vuelve a abrir la página.</div>`; foot(); return; }

  const C = compute();
  let html = '';
  if (S.flash) html += `<div class="note ${S.flash.t}">${esc(S.flash.m)}</div>`;
  if (window.groupApi && isAdmin() && (window.groupApi.requests||[]).length){ const n=window.groupApi.requests.length; html += `<div class="note ok row spread"><span><strong>${n} solicitud${n===1?'':'es'} de acceso</strong> esperando tu respuesta.</span><button class="btn" data-openreq>Ver</button></div>`; }
  html += promoNotices() + confirmNotice(v==='hoy');
  if (!S.uid) html += `<div class="note">Estás viendo la clasificación sin identificarte. Para apuntar partidos, entra con tu cuenta.</div>`;
  else if (!S.canWrite) html += `<div class="note">Tienes acceso de solo lectura. Pide a un administrador que revise tu acceso.</div>`;
  else if (!myPlayer()) html += joinPanel();

  if (v==='partidos') html += viewMatches(C);
  else if (v==='calendario') html += viewCalendar();
  else if (v==='evento-nuevo') html += viewEventNew();
  else if (v==='torneos') html += viewTournaments();
  else if (v==='torneo-nuevo') html += viewTournamentNew();
  else if (v.startsWith('torneo-')) html += viewTournament(v.slice(7));
  else if (v==='nuevo') html += viewNew();
  else if (v.startsWith('editar-')) html += viewNew(S.matches.find(m=>m.id===v.slice(7)) || null);
  else if (v==='cara-a-cara') html += viewH2H(C);
  else if (v.startsWith('jugador-')) html += viewPlayer(C, v.slice(8));
  else if (v==='clasificacion') html += viewRanking(C);
  else if (v==='ajustes') html += viewAjustes();
  else html += viewHoy(C);

  app.innerHTML = `<div class="stack">${html}</div>`;
  bindView(v);
  if (S.lastView !== v){ const first = S.lastView === undefined; S.lastView = v; countUp(app); if (app.firstElementChild) app.firstElementChild.classList.add('vin'); if (!first && !v.startsWith('torneo-')) window.scrollTo(0, 0); }
  paintAvatars();
  foot();
}

function sortRows(list){
  const k = S.rsort || 'pos', dir = S.rdir || -1;
  if (k==='pos') return list;
  const val = x => k==='pg' ? x.s.pg : k==='pe' ? x.s.pe : k==='pj' ? x.s.pj : k==='sets' ? pSets(x.s) : pGames(x.s);
  return [...list].sort((a,b) => dir * (val(a)-val(b)) || (a.pos-b.pos));
}
function beerRanking(){
  const evs = allEvents().filter(e => e.beers!==false && (e.date||'') <= today() && (S.period==='todo' || (e.date||'').startsWith(S.period==='mes'?today().slice(0,7):today().slice(0,4))));
  if (!evs.length) return '';
  const cnt = {};
  for (const e of evs) for (const r of evRsvps(e.id)) if (r.beer===true){ const p = playerByUid(r.uid); if (p) cnt[p.id] = (cnt[p.id]||0)+1; }
  const top = Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,5);
  if (!top.length) return '';
  const mx = top[0][1];
  return `<div class="panel"><h3>${MUG} Ranking de cervezas · ${periodLabel(S.period)}</h3>
    ${top.map(([pid,n],i)=>`<div class="kv"><span class="pname"><span class="rpos ${i===0?'p1':''}" style="width:26px;height:26px;font-size:13px">${i+1}</span>${av(pid)}<span>${esc(nick(pid))}</span></span><span><span class="bar" style="width:90px"><i style="width:${Math.round(100*n/mx)}%;background:var(--gold)"></i></span><strong>${n}</strong> <span class="muted small">de ${evs.length}</span></span></div>`).join('')}
  </div>`;
}
function periodLabel(p){ return p==='mes'?'Este mes':p==='anio'?'Este año':'Histórico'; }

function rivalsOf(m){
  const cp = playerByUid(m.by)?.id;
  return m.a.includes(cp) ? m.b : m.b.includes(cp) ? m.a : [...m.a, ...m.b];
}
function canConfirm(m){
  if (m.confirmed!==false || autoPublished(m) || !S.uid) return false;
  if (isAdmin()) return true;
  const me = myPlayer()?.id; return !!me && m.by!==S.uid && rivalsOf(m).includes(me);
}
function confirmNotice(skipMine){
  if (!S.uid || S.status!=='ready') return '';
  const n = S.matches.filter(m => canConfirm(m) && !m.disputed && (!isAdmin() || rivalsOf(m).includes(myPlayer()?.id))).length;
  const disp = isAdmin() ? S.matches.filter(m => !isCounted(m) && m.disputed).length : 0;
  let out = '';
  if (n && !skipMine) out += `<div class="note row spread" style="background:color-mix(in srgb,var(--gold) 22%,var(--surface))"><span><strong>Tienes ${n} resultado${n===1?'':'s'} por confirmar.</strong> Si no dices nada, se publica${n===1?'':'n'} solo${n===1?'':'s'} a las 4 horas.</span><a class="btn" href="#partidos">Revisar</a></div>`;
  if (disp) out += `<div class="note err row spread"><span><strong>${disp} resultado${disp===1?'':'s'} discutido${disp===1?'':'s'}.</strong> Revísalo y corrígelo o bórralo.</span><a class="btn" href="#partidos">Ver</a></div>`;
  return out;
}

function matchCard(m, C){
  const r = result(m), d = C.deltas[m.id];
  const canDel = !m.tid && isAdmin();
  const setCells = (mine, other) => (m.sets||[]).map(([x,y],i)=>{ const a = mine===0?x:y, b = mine===0?y:x; return `<span class="${a>b?'b':'lo'}">${a}</span>`; }).join('');
  return `<article class="match">

function pendingMatches(){
  const out = [];
  for (const e of allEvents()){
    const sm = evSummary(e);
    if (sm.starters.length < sm.slots || sm.slots < 4) continue;          // only full sign-ups
    const courts = makePairs(e, sm);
    courts.forEach((c, i) => {
      if (S.matches.some(m => m.eventId===e.id && (m.court||0)===i)) return; // result already saved
      out.push({e, c, i, n:courts.length});
    });
  }
  return out.sort((a,b)=>(a.e.date+(a.e.time||'')).localeCompare(b.e.date+(b.e.time||'')));
}
function pendingCard(p){
  const {e, c, i, n} = p, past = (e.date||'') <= today();
  const team = t => `<div class="team">${teamAvs(t)}<span class="names" style="color:var(--fg)">${esc(t.map(id=>nick(id)).join(' · '))}</span></div>`;
  return `<article class="match pending-m">
    ${team(c.A)}<div class="sets"><span class="lo">–</span></div>
    ${team(c.B)}<div class="sets"><span class="lo">–</span></div>
    <div class="mfoot">
      <span class="tag" style="background:${past?'var(--gold)':'var(--tonal, var(--surface-2))'};color:${past?'#3a2c00':'inherit'}">${past?'Pendiente de resultado':'Próximo'}</span>
      <span>${esc(evWhen(e))}${e.place?' · '+esc(e.place):''}${n>1?` · pista ${i+1}`:''}</span>
      ${past && S.canWrite && S.uid ? `<button class="btn primary" style="margin-left:auto;min-height:34px;padding:6px 14px" data-pendres="${esc(e.id)}" data-court="${i}">Apuntar resultado</button>`:''}
    </div>
  </article>`;
}
function viewMatches(C){

  let out = agendaHead('partidos', `<span class="muted small">${list.length} jugado${list.length===1?'':'s'}</span>`);

    out += `<h3 style="margin:4px 0 -4px">Por confirmar</h3>`;
    out += unconf.map(m => `<div class="day">${fmtDay(m.date)}</div>${matchCard(m, C)}`).join('');

  if (!list.length && !pend.length && !unconf.length) return `<section class="stack" style="gap:12px">${out}<section class="panel empty">${COURT_ART}<h2>Sin partidos todavía</h2><p class="muted">Cuando una convocatoria se complete aparecerá aquí. También puedes apuntar un resultado ya.</p>${S.canWrite&&S.uid?'<a class="btn primary" href="#nuevo">+ Apuntar el primero</a>':''}</section></section>`;
  if (list.length && (pend.length || unconf.length)) out += `<h3 style="margin:8px 0 -4px">Jugados</h3>`;
  let last = '';
  for (const m of list){ if (m.date!==last){ out += `<div class="day">${fmtDay(m.date)}</div>`; last = m.date; } out += matchCard(m,C); }
  return `<section class="stack" style="gap:12px">${out}</section>`;
}

function strip(log){
  if (!log.length) return `<p class="muted small" style="margin:0">Aparecerá tras su primer partido.</p>`;
  const items = log.slice(-24), mx = Math.max(3, ...items.map(x=>Math.abs(x.diff)));
  return `<div class="strip" role="img" aria-label="Resultados de los últimos partidos">${items.map(x => {
    const h = Math.max(12, Math.round(100*Math.abs(x.diff)/mx));
    const t = `${fmtDay(x.date)} · ${x.won?'Ganado':'Perdido'} ${x.sets}`;
    return x.draw ? `<div class="c" title="${esc(fmtDay(x.date)+' · Empate '+x.sets)}"><div class="up"><i style="height:8%;background:var(--muted);opacity:.5;border-radius:3px 3px 0 0"></i></div><div class="dn"><i style="height:8%;background:var(--muted);opacity:.5;border-radius:0 0 3px 3px"></i></div></div>` : `<div class="c" title="${esc(t)}"><div class="up">${x.won?`<i style="height:${h}%"></i>`:''}</div><div class="dn">${!x.won?`<i style="height:${h}%"></i>`:''}</div></div>`;
  }).join('')}</div>
  <p class="small muted" style="margin:8px 0 0">De más antiguo a más reciente. Verde, ganado; rojo, perdido; gris, empate. La altura es la diferencia de juegos.</p>`;
}

function sideCourt(s){

  const main = d.pj >= r.pj ? 'drive' : 'reves';
  const pctS = x => x.pj ? Math.round(100*x.pg/x.pj)+'%' : '–';

/* ---------- score validation (padel/tennis rules) ---------- */
// A set ends 6-0…6-4, 7-5 or 7-6. Best of 3: 2-0 or 2-1.
function validSet(a,b){ const w=Math.max(a,b), l=Math.min(a,b); return (w===6 && l<=4) || (w===7 && (l===5 || l===6)); }
function parseSetInputs(pa, pb, allowDraw){
  const raw = [];
  for (let i=0;i<3;i++){
    const x=$('#'+pa+i).value.trim(), y=$('#'+pb+i).value.trim();
    if (x==='' && y===''){ raw.push(null); continue; }
    if (x===''||y==='') return {err:`Completa los dos marcadores del set ${i+1}.`};
    const a=+x, b=+y;
    if (!Number.isInteger(a)||!Number.isInteger(b)||a<0||b<0) return {err:`El set ${i+1} tiene un número no válido.`};
    if (a>7||b>7) return {err:`El set ${i+1} no puede pasar de 7 juegos.`};
    raw.push([a,b]);
  }
  if (!raw[0]) return {err:'Falta el resultado del set 1.'};
  if (!validSet(...raw[0])) return {err:`El set 1 (${raw[0][0]}-${raw[0][1]}) no es un resultado posible. Un set acaba 6-0 a 6-4, 7-5 o 7-6.`};
  if (!raw[1]) return {err:'Falta el resultado del set 2. El partido se juega al mejor de 3 sets.'};
  const unfinished = [];
  const fin2 = validSet(...raw[1]);
  if (!fin2){
    unfinished.push(2);
    if (raw[2]) return {err:'El set 2 no está terminado, así que el set 3 debe quedar vacío.'};
  } else {
    const w1 = raw[0][0]>raw[0][1], w2 = raw[1][0]>raw[1][1];
    if (w1===w2 && raw[2]) return {err:'El partido ya estaba decidido 2-0 tras el segundo set. Deja vacío el set 3.'};
    if (w1!==w2 && !raw[2]) unfinished.push(3);
    if (raw[2] && !validSet(...raw[2])) unfinished.push(3);
  }
  const sets = raw.filter(Boolean);
  const r = result({sets});
  if (r.sa===r.sb && r.ga===r.gb && !allowDraw) return {err:'Con este resultado el partido queda empatado a sets y a juegos, así que no hay ganador. Revisa los marcadores.'};
  return {sets, unfinished, draw: r.draw};
}
function unfinishedText(ps){
  const r = result({sets:ps.sets});
  const parts = ps.unfinished.map(n => { const st = ps.sets[n-1]; return st ? `el set ${n} (${st[0]}-${st[1]}) no está terminado` : `falta jugar el set ${n}`; });
  const how = r.draw ? `El partido queda en empate (${r.sa}-${r.sb} en sets y ${r.ga}-${r.gb} en juegos).` : r.sa!==r.sb ? `Gana la pareja ${r.aWins?1:2} por sets (${Math.max(r.sa,r.sb)}-${Math.min(r.sa,r.sb)}).` : `Van empatados a sets: gana la pareja ${r.aWins?1:2} por juegos (${Math.max(r.ga,r.gb)}-${Math.min(r.ga,r.gb)}).`;
  return `Según el marcador, ${parts.join(' y ')}. ${how} ¿Quieres guardar el resultado igualmente?`;
}

/* ---------- tournaments ---------- */
const GL = i => String.fromCharCode(65+i);
const pairName = t => t ? t.map(id => nick(id)).join(' / ') : '';
function seedOrder(n){ let o=[1,2]; while(o.length<n){ const m=o.length*2+1; o=o.flatMap(x=>[x,m-x]); } return o; }
function roundName(matches){ return matches===1?'Final':matches===2?'Semifinales':matches===4?'Cuartos':matches===8?'Octavos':'Dieciseisavos'; }
function koLabel(G,Q){ if(!Q) return 'Solo fase de grupos'; let N=2; while(N<G*Q) N*=2; return `${G*Q} parejas a ${roundName(N/2).toLowerCase()}${N>G*Q?' (con pases directos)':''}`; }

function tState(t){
  if (t.type==='americano') return amState(t);
  if (t.type==='pozo') return pozoState(t);
  const R = {...(t.results||{})}; for (const [k,v] of S.tres) if (k.startsWith(t.id+'~')) R[k.slice(t.id.length+1)] = v;
  const groups = (t.groups||[]).map((g,gi) => {
    const n = g.teams.length, matches = [];
    for (let i=0;i<n;i++) for (let j=i+1;j<n;j++){ const key=`g${gi}-${i}-${j}`; const r=R[key]; matches.push({key,i,j,sets:r&&r.sets?r.sets.map(s=>[...s]):null}); }
    const st = g.teams.map((team,i)=>({i,team,pj:0,pg:0,sf:0,sc:0,gf:0,gc:0}));
    for (const m of matches) if (m.sets){ const r=result({sets:m.sets}), A=st[m.i], B=st[m.j];
      A.pj++; B.pj++; if (r.aWins) A.pg++; else B.pg++;
      A.sf+=r.sa; A.sc+=r.sb; A.gf+=r.ga; A.gc+=r.gb; B.sf+=r.sb; B.sc+=r.sa; B.gf+=r.gb; B.gc+=r.ga; }
    const standings = [...st].sort((a,b)=>(b.pg-a.pg)||(pSets(b)-pSets(a))||(pGames(b)-pGames(a))||(a.i-b.i));
    const played = matches.filter(m=>m.sets).length;
    return {name:GL(gi), teams:g.teams, matches, standings, played, complete: played===matches.length};
  });
  const Q = t.qualify||0, rounds = [];
  let champion = null, total = groups.reduce((a,g)=>a+g.matches.length,0), done = groups.reduce((a,g)=>a+g.played,0);
  if (Q>0 && groups.length){
    const G = groups.length, seeds = [];
    for (let p=0;p<Q;p++){ const rot = p%2 ? Math.floor(G/2) : 0; for (let k=0;k<G;k++) seeds.push({gi:(k+rot)%G, p}); }
    let N=2; while (N<seeds.length) N*=2;
    const slots = seedOrder(N).map(s => seeds[s-1] || null);
    if (G>1) for (let k=0;k<N/2;k++){ const a=slots[2*k], b=slots[2*k+1];
      if (a && b && a.gi===b.gi) for (let m=0;m<N/2;m++){ if (m===k) continue; const c=slots[2*m+1], d=slots[2*m];
        if (c && c.gi!==a.gi && (!d || d.gi!==b.gi)){ slots[2*k+1]=c; slots[2*m+1]=b; break; } } }
    const resolve = s => { if (!s) return {bye:true}; const g=groups[s.gi], lab=`${s.p+1}º grupo ${g.name}`;
      return g.complete && g.standings[s.p] ? {team:g.standings[s.p].team, lab} : {lab}; };
    let cur = []; for (let k=0;k<N/2;k++) cur.push([resolve(slots[2*k]), resolve(slots[2*k+1])]);
    let r = 0;
    for(;;){
      const round = cur.map(([top,bot],m) => {
        const key=`k${r}-${m}`; let winner=null, sets=null, auto=false;
        if (top.bye && bot.bye){ winner={bye:true}; auto=true; }
        else if (top.bye || bot.bye){ winner = top.bye ? bot : top; auto=true; }
        else { total++; const rr=R[key]; if (rr && rr.sets && top.team && bot.team){ sets=rr.sets.map(s=>[...s]); done++; winner = result({sets}).aWins ? top : bot; } }
        return {key, top, bot, sets, winner, auto, r, m};
      });
      rounds.push(round);
      if (round.length===1){ const w=round[0].winner; if (w && w.team) champion=w.team; break; }
      const name = roundName(round.length).toLowerCase().replace(/es$/,'').replace(/s$/,'');
      cur = []; for (let k=0;k<round.length/2;k++){
        const w = x => x.winner ? (x.winner.bye ? {bye:true} : (x.winner.team ? {team:x.winner.team, lab:x.winner.lab} : {lab:x.winner.lab})) : {lab:`Ganador ${name} ${x.m+1}`};
        cur.push([w(round[2*k]), w(round[2*k+1])]);
      }
      r++;
    }
  } else if (groups.length===1 && groups[0].complete) champion = groups[0].standings[0]?.team || null;
  else if (groups.length>1 && groups.every(g=>g.complete) && !Q) champion = null;
  return {groups, rounds, champion, total, done, finished: !!champion || (total>0 && done===total)};
}

function tournamentMatches(){
  const out = [];
  for (const t of S.tournaments.values()){
    if (t.count===false || t.type==='pozo' || t.type==='americano') continue;
    const ts = tState(t);

/* Americano "todos con todos": every player partners every other player once (round-robin of pairs),
   and pairs are matched up inside each round so that opponents are spread as evenly as possible. */
// Perfect "whist" tables (found by search and verified): over all rounds every player partners each other player
// exactly once and faces each other player exactly twice. Index N-1 is the fixed player; the rest rotate mod N-1.
const WHIST = {4:[[3,0,1,2]], 8:[[7,2,3,0],[5,4,1,6]], 12:[[11,10,2,1],[6,4,0,7],[3,9,5,8]], 16:[[15,6,8,14],[13,5,2,3],[4,7,12,1],[11,9,0,10]]};
// N = 4k+1: perfect cyclic tables over Z_N (one player rests each round, a different one every round).
const WHIST1 = {5:[[3,2,4,1]], 13:[[3,5,8,12],[6,1,7,4],[11,10,9,2]]};
function amOptions(N){
  const k = Math.floor(N/4); if (k<1 || N>16) return null;
  const ideal = N%4===0 ? N-1 : N%4===1 ? N : Math.ceil(N*(N-1)/(4*k));
  // recommended: the number of rounds closest to the ideal in which everybody plays the same number of matches
  let def = ideal;
  if (N%4>1){ let bestD = Infinity; for (let r=1; r<=2*ideal; r++) if ((4*k*r) % N === 0){ const d = Math.abs(r-ideal); if (d < bestD || (d===bestD && r>def)){ bestD = d; def = r; } } }
  const Rmax = Math.max(ideal, def) + (N%4>1 ? Math.ceil(N/(4*k)) : 0);
  return {k, rest:N-4*k, ideal, Rmax, def, plays: r => 4*k*r/N, perfect: N%4<=1};
}
function buildAmericano(players, nRounds){
  const N = players.length, m = N-1;
  if (WHIST1[N]){
    const rounds = [];
    for (let r=0; r<Math.min(nRounds||N, N); r++) rounds.push(WHIST1[N].map(q => q.map(v => players[(v+r)%N])));
    return rounds;
  }
  if (N%4 !== 0) return buildAmericanoRest(players, nRounds || amOptions(N).def);
  if (WHIST[N]){
    const rounds = [];
    for (let r=0; r<Math.min(nRounds||m, m); r++)
      rounds.push(WHIST[N].map(q => q.map(v => players[v===m ? m : (v+r)%m])));
    return rounds;
  }
  return buildAmericanoSearch(players, nRounds);
}
/* N not 4k or 4k+1: rounds with rotating rests. Random restarts, keep the most balanced schedule:
   rests spread evenly, partners repeated as little as possible, opponents spread. */
function buildAmericanoRest(players, R){
  const N = players.length, k = Math.floor(N/4), key = (a,b) => a<b ? a+'|'+b : b+'|'+a;
  const tries = N<=8 ? 300 : N<=12 ? 120 : 60, samples = N<=8 ? 80 : 50;
  const shuffle = a => { for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
  let best = null, bestScore = Infinity;
  for (let t=0; t<tries; t++){
    const part = {}, opp = {}, rests = {}; players.forEach(p => rests[p]=0);
    const rounds = [];
    for (let r=0; r<R; r++){
      const order = shuffle(players.slice()).sort((a,b) => rests[a]-rests[b]);
      const resting = order.slice(0, N-4*k), playing = order.slice(N-4*k);
      resting.forEach(p => rests[p]++);
      let bg = null, bc = Infinity;
      for (let sI=0; sI<samples; sI++){
        const q = shuffle(playing.slice()); let c = 0;
        for (let i=0;i<q.length;i+=4){ const [a,b,cc,d] = q.slice(i,i+4);
          c += 60*Math.pow(part[key(a,b)]||0,2) + 60*Math.pow(part[key(cc,d)]||0,2);
          for (const x of [a,b]) for (const y of [cc,d]) c += Math.pow(opp[key(x,y)]||0,2); }
        if (c < bc){ bc = c; bg = q; }
      }
      const ms = [];
      for (let i=0;i<bg.length;i+=4){ const [a,b,cc,d] = bg.slice(i,i+4); ms.push([a,b,cc,d]);
        part[key(a,b)] = (part[key(a,b)]||0)+1; part[key(cc,d)] = (part[key(cc,d)]||0)+1;
        for (const x of [a,b]) for (const y of [cc,d]) opp[key(x,y)] = (opp[key(x,y)]||0)+1; }
      rounds.push(ms);
    }
    let sc = 0; const rv = Object.values(rests); sc += 200*(Math.max(...rv)-Math.min(...rv));
    for (let i=0;i<N;i++) for (let j=i+1;j<N;j++){ const kk = key(players[i],players[j]); sc += 40*Math.pow(Math.max(0,(part[kk]||0)-1),2) + 25*((part[kk]||0)===0?1:0) + Math.pow((opp[kk]||0)-2,2); }
    if (sc < bestScore){ bestScore = sc; best = rounds; }
  }
  return best;
}
function buildAmericanoSearch(players, nRounds){
  // try several labelings of the round-robin and keep the one where opponents are spread most evenly
  const N = players.length, tries = N<=8 ? 400 : N<=12 ? 120 : 40;
  let best = null, bs = Infinity;
  for (let t=0; t<tries; t++){
    const p = players.slice(); if (t) for (let i=p.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [p[i],p[j]]=[p[j],p[i]]; }
    const sch = buildAmericanoOnce(p, nRounds), opp = {};
    for (const rd of sch) for (const [a,b,c,d] of rd) for (const x of [a,b]) for (const y of [c,d]){ const k = x<y ? x+'|'+y : y+'|'+x; opp[k] = (opp[k]||0)+1; }
    const target = 2*sch.length/(N-1); let sc = 0;
    for (let i=0;i<N;i++) for (let j=i+1;j<N;j++){ const a=players[i], b=players[j], k = a<b ? a+'|'+b : b+'|'+a, v = opp[k]||0; sc += Math.pow(v-target,2) + (v===0 ? 3 : 0); }
    if (sc < bs){ bs = sc; best = sch; }
  }
  return best;
}
function buildAmericanoOnce(players, nRounds){
  const N = players.length, x = players.slice(1), R = N-1, opp = {};
  const k = (a,b) => a<b ? a+'|'+b : b+'|'+a;
  const groupings = arr => { if (!arr.length) return [[]]; const [f,...rest] = arr, out = [];
    rest.forEach((p,i) => { const others = rest.filter((_,j)=>j!==i); for (const g of groupings(others)) out.push([[f,p], ...g]); }); return out; };
  const add = (g, d) => { for (const [A,B] of g) for (const a of A) for (const b of B) opp[k(a,b)] = (opp[k(a,b)]||0)+d; };
  const cost = g => g.reduce((t,[A,B]) => t + A.reduce((u,a)=>u+B.reduce((w,b)=>w+Math.pow((opp[k(a,b)]||0)+1,2),0),0), 0);
  const roundPairs = [], options = [], chosen = [];
  for (let r=0; r<Math.min(nRounds||R, R); r++){
    const pairs = [[players[0], x[r % R]]];
    for (let i=1;i<N/2;i++) pairs.push([x[(r+i)%R], x[(r-i+R*2)%R]]);
    roundPairs.push(pairs); options.push(groupings(pairs));
  }
  // greedy first pass, then a few passes of coordinate descent (re-pick each round's grouping given all the others)
  for (let r=0; r<options.length; r++){ let b=null, bc=Infinity; for (const g of options[r]){ const c=cost(g); if (c<bc){bc=c;b=g;} } chosen[r]=b; add(b,1); }
  for (let pass=0; pass<6; pass++){ let changed = false;
    for (let r=0; r<options.length; r++){ add(chosen[r],-1); let b=chosen[r], bc=cost(b);
      for (const g of options[r]){ const c=cost(g); if (c<bc){bc=c;b=g;} }
      if (b!==chosen[r]) changed = true; chosen[r]=b; add(b,1); }
    if (!changed) break; }
  return chosen.map(g => g.map(([A,B]) => [A[0],A[1],B[0],B[1]]));
}

function amState(t){
  const R = {...(t.results||{})}; for (const [k,v] of S.tres) if (k.startsWith(t.id+'~')) R[k.slice(t.id.length+1)] = v;
  const st = {}; (t.players||[]).forEach((id,i) => st[id] = {id, pj:0, pg:0, pp:0, gf:0, gc:0, seed:i});
  const rounds = (t.schedule||[]).map((rd, r) => rd.map((q, c) => { const key = `m${r}-${c}`, x = R[key];
    return {key, r, c, A:[q[0],q[1]], B:[q[2],q[3]], sets: x && x.sets ? x.sets.map(s=>[...s]) : null}; }));
  let done = 0, total = 0;
  for (const rd of rounds) for (const m of rd){ total++; if (!m.sets) continue; done++; const [a,b] = m.sets[0];
    for (const [team, gf, gc, won] of [[m.A,a,b,a>b],[m.B,b,a,b>a]]) for (const id of team){ const s = st[id]; if (!s) continue; s.pj++; won ? s.pg++ : s.pp++; s.gf+=gf; s.gc+=gc; } }
  const standings = Object.values(st).sort((p,q)=> ((q.gf-q.gc)-(p.gf-p.gc)) || ((q.pg-q.pp)-(p.pg-p.pp)) || (q.gf-p.gf) || (p.seed-q.seed));
  const finished = total>0 && done===total;
  return {type:'americano', rounds, standings, total, done, finished, champion: finished && standings[0] ? [standings[0].id] : null, nC: rounds[0]?rounds[0].length:0, NR: rounds.length, groups:[]};
}

}

function pozoState(t){
  const R = {...(t.results||{})}; for (const [k,v] of S.tres) if (k.startsWith(t.id+'~')) R[k.slice(t.id.length+1)] = v;
  const P = (t.players||[]).filter(Boolean), nC = Math.floor(P.length/4), NR = t.rounds||5;
  const st = {}; P.forEach((id,i) => st[id] = {id, pj:0, pg:0, gf:0, gc:0, court:Math.floor(i/4), seed:i});
  let courts = []; for (let c=0;c<nC;c++) courts.push(P.slice(c*4, c*4+4));
  const rounds = []; let done = 0;
  for (let r=0; r<NR; r++){
    const ms = courts.map((q,c) => { const key=`r${r}-c${c}`, x=R[key]; return {key, r, c, A:[q[0],q[3]], B:[q[1],q[2]], sets: x && x.sets ? x.sets.map(s=>[...s]) : null}; });
    rounds.push(ms);
    ms.forEach(m => [...m.A, ...m.B].forEach(id => { if (st[id]) st[id].court = m.c; }));
    for (const m of ms) if (m.sets){ const [a,b] = m.sets[0]; done++;
      for (const [team, gf, gc, won] of [[m.A,a,b,a>b],[m.B,b,a,b>a]]) for (const id of team){ const s=st[id]; if (!s) continue; s.pj++; if (won) s.pg++; s.gf+=gf; s.gc+=gc; } }
    if (!ms.every(m => m.sets) || r===NR-1) break;
    const next = Array.from({length:nC}, () => []);
    for (const m of ms){ const [a,b] = m.sets[0], W = a>b ? m.A : m.B, L = a>b ? m.B : m.A;
      next[Math.max(0, m.c-1)].push(...W); next[Math.min(nC-1, m.c+1)].push(...L); }
    courts = next;
  }
  const standings = Object.values(st).sort((x,y)=> (y.gf-x.gf) || (y.pg-x.pg) || ((y.gf-y.gc)-(x.gf-x.gc)) || (x.court-y.court) || (x.seed-y.seed));
  const total = nC*NR, finished = total>0 && done===total;
  return {type:'pozo', rounds, standings, total, done, finished, champion: finished && standings[0] ? [standings[0].id] : null, nC, NR, groups:[]};
}

      <div class="stack" style="gap:6px;align-items:flex-end"><span class="small muted">${ts.done} de ${ts.total} partidos</span><span class="progress"><i style="width:${ts.total?Math.round(100*ts.done/ts.total):0}%"></i></span></div></div>

    ${!ts.finished ? `<div class="panel stack" style="gap:12px"><div class="row spread"><h3 style="margin:0">Ronda ${cur[0]?cur[0].r+1:1} de ${ts.NR}</h3>${curDone?'<span class="small muted">Ronda completa</span>':`<span class="small muted">${cur.filter(m=>m.sets).length}/${cur.length} pistas apuntadas</span>`}</div>

function pozoFields(f, ps){
  const n = f.pp.length, o = amOptions(n), ok = !!o;
  const rounds = ok ? (f.rounds && f.rounds<=o.Rmax ? f.rounds : o.def) : 0;
  const lab = r => { const p = o.plays(r); return Number.isInteger(p) ? `${r} · todos juegan ${p}` : `${r} · unos ${Math.floor(p)} y otros ${Math.ceil(p)} partidos`; };
  return `<div>
      <div class="row spread" style="margin-bottom:10px"><h3 style="margin:0">Jugadores</h3><span class="row" style="gap:4px"><button class="btn link" type="button" id="pzAll">Todos</button><button class="btn link" type="button" id="pzNone">Ninguno</button></span></div>
      <div class="pzpick">${ps.map(p=>`<label class="pzp ${f.pp.includes(p.id)?'on':''}"><input type="checkbox" data-pp="${esc(p.id)}"${f.pp.includes(p.id)?' checked':''}>${av(p.id)}<span>${esc(p.nick)}</span></label>`).join('')}</div>
      <p class="small ${ok?'':'muted'}" style="margin:10px 0 0">${n} elegido${n===1?'':'s'} · ${ok?`<strong>${o.k} pista${o.k===1?'':'s'}</strong>${o.rest?` · descansa${o.rest>1?'n':''} ${o.rest} por ronda`:''}`:'elige entre 4 y 16 jugadores'}</p>
    </div>
    ${ok?`<div class="row">
      <label class="f">Rondas<select id="pzR">${Array.from({length:o.Rmax},(_,i)=>o.Rmax-i).map(r=>`<option value="${r}"${r===rounds?' selected':''}>${lab(r)}${r===o.def?' (recomendado)':''}</option>`).join('')}</select></label>
    </div>
    <div class="chips"><span class="chip">${rounds*o.k} partidos</span><span class="chip">${rounds} ronda${rounds===1?'':'s'}</span>${o.perfect && rounds===o.ideal?'<span class="chip live">Cada uno hace pareja con todos una vez</span>':rounds>=o.ideal?'<span class="chip live">Parejas y descansos lo más repartidos posible</span>':'<span class="chip">Con menos rondas no todos coinciden de pareja</span>'}</div>`:''}
    <p class="small muted" style="margin:0">Clasificación individual: primero juegos ganados menos perdidos, después partidos ganados menos perdidos. No cuenta para el ranking general.</p>`;
}

  app.querySelectorAll('[data-tsave]').forEach(f => f.onsubmit = e => { e.preventDefault();
    const r = readSets(); if (r.err){ const el=$('#tErr'); el.textContent=r.err; el.hidden=false; return; }
    const key=f.dataset.tsave;
    const save = () => { S.tEdit=null; write(()=>S.db.doc('tresults/'+tid+'~'+key).set({tid, key, sets:r.sets, unfinished:!!r.unfinished.length, by:S.uid, at:Date.now()}), 'Resultado guardado.'); };
    if (r.unfinished.length) askConfirm({title:'Partido no acabado', text:unfinishedText(r), actions:[{label:'Guardar resultado', run:save}]});

  app.querySelectorAll('[data-tclear]').forEach(b => b.onclick = () => { const key=b.dataset.tclear; askConfirm({title:'¿Borrar este resultado?', text:'El partido quedará pendiente y el grupo o el cuadro se recalcularán. No se puede deshacer.', actions:[{label:'Sí, borrar resultado', danger:true, run:()=>{ S.tEdit=null;
    write(()=>S.db.doc('tresults/'+tid+'~'+key).set({tid, key, sets:null, by:S.uid, at:Date.now()}), 'Resultado borrado.'); }}]}); });
  const da=$('[data-tdelask]'); if (da) da.onclick = () => { const t=S.tournaments.get(tid); askConfirm({title:'¿Borrar el torneo?', text:'Se borrarán el torneo, sus grupos y todos sus resultados. Si contaba para la clasificación, esos partidos dejarán de contar. No se puede deshacer.', detail:`<strong>${esc(t?.name||'')}</strong><br><span class="muted">${t?fmtDay(t.date):''}</span>`, actions:[{label:'Sí, borrar torneo', danger:true, run:()=>write(async()=>{ await S.db.doc('tournaments/'+tid).delete(); location.hash='torneos'; }, 'Torneo borrado.')}]}); };
  const dn=$('[data-tdelno]'); if (dn) dn.onclick = () => { S.tDel = null; render(); };
  const dy=$('[data-tdelyes]'); if (dy) dy.onclick = () => { S.tDel=null; write(async()=>{ await S.db.doc('tournaments/'+tid).delete(); location.hash='torneos'; }, 'Torneo borrado.'); };

  app.querySelectorAll('[data-pzedit]').forEach(b => b.onclick = () => { S.tEdit = b.dataset.pzedit; render(); const i=$('#pz-a'); if (i) i.focus(); });
  app.querySelectorAll('[data-pzclear]').forEach(b => b.onclick = () => { const key=b.dataset.pzclear; askConfirm({title:'¿Borrar este resultado?', text:'El partido quedará pendiente y la clasificación se recalculará.', actions:[{label:'Sí, borrar resultado', danger:true, run:()=>{ S.tEdit=null; write(()=>S.db.doc('tresults/'+tid+'~'+key).set({tid, key, sets:null, by:S.uid, at:Date.now()}), 'Resultado borrado.'); }}]}); });
  app.querySelectorAll('[data-pzsave]').forEach(fm => fm.onsubmit = e => { e.preventDefault();
    const a = +$('#pz-a').value, b2 = +$('#pz-b').value, er = $('#pzErr');
    if (!Number.isInteger(a) || !Number.isInteger(b2) || a<0 || b2<0 || $('#pz-a').value==='' || $('#pz-b').value==='') { er.textContent='Escribe los juegos de las dos parejas.'; er.hidden=false; return; }
    if (a===b2) { er.textContent='No puede haber empate: tiene que ganar una pareja.'; er.hidden=false; return; }
    const key = fm.dataset.pzsave; S.tEdit = null;
    write(()=>S.db.doc('tresults/'+tid+'~'+key).set({tid, key, sets:[[a,b2]], by:S.uid, at:Date.now()}), 'Resultado guardado.'); });
  const form = $('#tForm'); if (!form) return;

      const id = 't' + rid().slice(1);
      $('#tSave').disabled = true;
      write(async()=>{ await S.db.doc('tournaments/'+id).set({type:'americano', name, date:f.date||today(), players:order, rounds, schedule, count:false, groups:[], results:{}, createdBy:S.uid, createdAt:Date.now()}); S.tf=null; location.hash='torneo-'+id; }, `Pozo «${name}» creado con ${schedule.reduce((t,rd)=>t+rd.length,0)} partidos.`);
    };

  }
  $('#tCount').onchange = e => f.count = e.target.checked;
  $('#tG').onchange = e => { f.G = +e.target.value; render(); };
  $('#tP').onchange = e => { f.P = +e.target.value; if (f.Q>f.P) f.Q=f.P; render(); };
  $('#tQ').onchange = e => { f.Q = +e.target.value; render(); };
  app.querySelectorAll('[data-slot]').forEach(s => s.onchange = () => { f.slots[s.dataset.slot] = s.value; });
  $('#tClear').onclick = () => { f.slots = {}; render(); };
  $('#tRandom').onclick = () => {
    const ids = [...S.players.keys()];
    for (let i=ids.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [ids[i],ids[j]]=[ids[j],ids[i]]; }
    f.slots = {}; let k=0;
    for (let g=0;g<f.G;g++) for (let i=0;i<f.P;i++) for (let s=0;s<2;s++){ if (k<ids.length) f.slots[`${g}-${i}-${s}`]=ids[k++]; }
    render();
  };
  form.onsubmit = e => { e.preventDefault();
    const err = m => { const el=$('#tFormErr'); el.textContent=m; el.hidden=false; };
    const name = f.name.trim(); if (!name) return err('Ponle nombre al torneo.');
    const groups = [], used = new Set();
    for (let g=0;g<f.G;g++){ const teams=[];
      for (let i=0;i<f.P;i++){ const a=f.slots[`${g}-${i}-0`], b=f.slots[`${g}-${i}-1`];
        if (!a||!b) return err(`Falta completar la pareja ${i+1} del grupo ${GL(g)}.`);
        for (const x of [a,b]){ if (used.has(x)) return err(`${nick(x)} aparece en más de una pareja.`); used.add(x); }
        teams.push([a,b]); }
      groups.push({teams}); }
    const id = 't' + rid().slice(1);
    $('#tSave').disabled = true;
    write(async()=>{ await S.db.doc('tournaments/'+id).set({name, date:f.date||today(), groups, qualify:f.Q, count:f.count, results:{}, createdBy:S.uid, createdAt:Date.now()}); S.tf=null; location.hash='torneo-'+id; }, `Torneo «${name}» creado.`);
  };
}

function seriesOccurrences(sr){
  const out = []; if (!sr.start) return out;
  const [y,m,d] = sr.start.split('-').map(Number); let dt = new Date(y, m-1, d);
  const [ty,tm,td] = today().split('-').map(Number); const t0 = new Date(ty, tm-1, td);
  const horizon = new Date(ty, tm-1, td+84), minPast = new Date(ty, tm-1, td-182);
  const skip = new Set(sr.skip||[]);
  while (dt <= horizon){
    const iso = isoD(dt);
    if (sr.until && iso > sr.until) break;
    if (dt >= minPast && !skip.has(iso)) out.push({id:`${sr.id}_${iso}`, date:iso, time:sr.time||'', title:sr.title||'Partido', place:sr.place||'', slots:sr.slots||4, beers:sr.beers!==false, note:sr.note||'', seriesId:sr.id});

}

}
